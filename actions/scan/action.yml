name: 'TRUSCA Scan'
description: 'Trigger a TRUSCA scan and gate the build on Critical CVEs / forbidden licenses.'
author: 'TrustedOSS'
branding:
  icon: 'shield'
  color: 'blue'

# -----------------------------------------------------------------------------
# Inputs
# -----------------------------------------------------------------------------
# All values that touch the network (api-url, api-key, project-id) are taken
# from caller inputs rather than env so that the same workflow file can be
# pointed at different portals (prod / staging) without editing the action.
# -----------------------------------------------------------------------------
inputs:
  api-url:
    description: 'TrustedOSS Portal API base URL (e.g., https://trustedoss.example.com). Trailing slash is allowed.'
    required: true
  api-key:
    description: 'TrustedOSS API key (use a GitHub secret). Format: tos_<8-char prefix>_<32-char secret>.'
    required: true
  project-id:
    description: 'TrustedOSS project UUID — the last path segment of the project URL.'
    required: true
  scan-kind:
    description: 'Scan pipeline to enqueue. "source" runs cdxgen + Trivy. "container" runs Trivy.'
    required: false
    default: 'source'
  image-ref:
    description: >-
      Image to scan, e.g. ghcr.io/acme/api:1.4.0. Required when scan-kind is
      "container" and ignored otherwise. Push the image before this step runs —
      the portal pulls it, so a tag that exists only on the runner is not
      reachable.
    required: false
    default: ''
  fail-on-gate:
    description: 'If "true", exit 1 on gate=fail (build-blocking). Default: true.'
    required: false
    default: 'true'
  post-pr-comment:
    description: 'If "true" (and triggered by pull_request event), post the SCA report to the PR.'
    required: false
    default: 'true'
  sarif-file:
    description: >-
      Path to write the scan's open findings to as a SARIF 2.1.0 document.
      Empty (the default) writes nothing. Upload it with
      github/codeql-action/upload-sarif to put the findings in the repository's
      Code scanning tab. Written even when the gate passes: an empty run is what
      clears alerts that have since been fixed.
    required: false
    default: ''
  poll-timeout-seconds:
    description: 'Maximum seconds to wait for the scan to reach a terminal state (succeeded/failed/cancelled). Default: 1800 (30 min).'
    required: false
    default: '1800'
  poll-interval-seconds:
    description: 'Seconds to sleep between scan-status polls. Default: 30.'
    required: false
    default: '30'

# -----------------------------------------------------------------------------
# Outputs
# -----------------------------------------------------------------------------
outputs:
  scan-id:
    description: 'UUID of the scan that was enqueued and evaluated.'
    value: ${{ steps.trigger.outputs.scan_id }}
  gate:
    description: 'Final gate verdict (pass | fail).'
    value: ${{ steps.gate.outputs.gate }}
  reason:
    description: 'Human-readable reason for the gate verdict (null when pass).'
    value: ${{ steps.gate.outputs.reason }}
  critical-cve-count:
    description: 'Number of open critical-severity findings on the evaluated scan.'
    value: ${{ steps.gate.outputs.critical_cve_count }}
  forbidden-license-count:
    description: 'Distinct components carrying a forbidden-classification license.'
    value: ${{ steps.gate.outputs.forbidden_license_count }}
  malicious-component-count:
    description: >-
      Distinct components the malicious-package snapshot flags. These block
      regardless of severity — remove the package and rotate the credentials
      this build could reach; upgrading does not help.
    value: ${{ steps.gate.outputs.malicious_component_count }}
  epss-gate-count:
    description: >-
      Open findings whose EPSS score met or exceeded the portal's configured
      threshold. Always 0 when the EPSS gate is switched off, which is the
      default — a zero here does not mean the axis was assessed and came back
      clean.
    value: ${{ steps.gate.outputs.epss_gate_count }}
  sarif-file:
    description: >-
      Path of the SARIF document written, or empty when the `sarif-file` input
      was not set. Lets an upload step reference it without repeating the path.
    value: ${{ steps.gate.outputs.sarif_file }}
  component-outcome:
    description: >-
      What the scan's SBOM ended up containing. `components_found` is the
      ordinary case. `empty_no_manifests` and `empty_with_manifests` both mean
      no components were produced, so a passing gate reflects the absence of
      anything to judge rather than a clean result; the first is expected for a
      build system TRUSCA cannot read, the second points at a scan failure.
      Empty on a portal too old to report it.
    value: ${{ steps.gate.outputs.component_outcome }}
  kev-gate-count:
    description: >-
      Open findings whose CVE is in the CISA Known Exploited Vulnerabilities
      catalog. `0` when the KEV axis is disabled (the default). Read
      `kev-outcome` before treating a `0` as an all-clear.
    value: ${{ steps.gate.outputs.kev_gate_count }}
  kev-outcome:
    description: >-
      What the KEV axis was able to judge: `not_configured`, `evaluated`,
      `partial` (findings discovered since the last catalog sync carry a
      default flag rather than an answer), or `no_data` (the catalog has never
      synced, so the axis decided nothing).
    value: ${{ steps.gate.outputs.kev_outcome }}
  eol-gate-count:
    description: >-
      Components on the evaluated scan past end of life. `0` when the
      end-of-life axis is disabled (the default).
    value: ${{ steps.gate.outputs.eol_gate_count }}
  eol-outcome:
    description: >-
      What the end-of-life axis was able to judge: `not_configured`,
      `evaluated`, `partial` (the lifecycle catalog covers a curated set of
      products, so uncovered dependencies are the ordinary case), or `no_data`
      (nothing on this scan has been checked at all).
    value: ${{ steps.gate.outputs.eol_outcome }}
  epss-outcome:
    description: >-
      What the EPSS axis of the gate was able to judge: `not_configured` (no
      threshold set), `evaluated` (every open finding carried a score),
      `partial` (some did not, so `epss-gate-count` of 0 is not a full answer),
      or `no_data` (none did, so the axis decided nothing at all). Empty on a
      portal too old to report it.
    value: ${{ steps.gate.outputs.epss_outcome }}

# -----------------------------------------------------------------------------
# Steps
# -----------------------------------------------------------------------------
# Each shell step pins `set -euo pipefail` so a failed curl, a missing jq, or
# an unexpected JSON shape stops the run loudly instead of silently passing.
# We never echo the API key — `curl --fail-with-body` and explicit status
# capture keep secrets out of stdout / stderr.
# -----------------------------------------------------------------------------
runs:
  using: 'composite'
  steps:
    # -------------------------------------------------------------------------
    # 0) Pre-flight — make sure jq is on PATH. GitHub-hosted runners ship it,
    #    but self-hosted runners (Alpine, slim images) frequently don't.
    # -------------------------------------------------------------------------
    - name: Verify jq is available
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v jq >/dev/null 2>&1; then
          echo "::error::jq is required but was not found on PATH. Install it on the runner (e.g. 'apt-get install -y jq' or 'apk add jq')."
          exit 1
        fi

    # -------------------------------------------------------------------------
    # 1) Trigger scan — POST /v1/projects/{id}/scans, capture scan_id
    # -------------------------------------------------------------------------
    - name: Trigger TrustedOSS scan
      id: trigger
      shell: bash
      env:
        TOS_API_URL: ${{ inputs.api-url }}
        TOS_API_KEY: ${{ inputs.api-key }}
        TOS_PROJECT_ID: ${{ inputs.project-id }}
        TOS_SCAN_KIND: ${{ inputs.scan-kind }}
        # scan-retention: forward the ref so the portal groups this branch's /
        # PR's scans under one retention key (the latest succeeds the prior).
        # `github.ref` is `refs/heads/<branch>` on push and `refs/pull/<n>/merge`
        # on pull_request — the portal normalizes both. `pull_request.number` is
        # empty on push events.
        TOS_REF: ${{ github.ref }}
        TOS_PR_NUMBER: ${{ github.event.pull_request.number }}
        TOS_IMAGE_REF: ${{ inputs.image-ref }}
      run: |
        set -euo pipefail
        # Strip trailing slash so we never construct a URL with `//v1/...`.
        api="${TOS_API_URL%/}"

        # Fail here rather than sending a request the portal will reject: the
        # message names the input the caller has to set, which a 422 body
        # relayed from the API does less clearly.
        if [ "${TOS_SCAN_KIND}" = "container" ] && [ -z "${TOS_IMAGE_REF}" ]; then
          echo "::error::scan-kind is 'container' but image-ref is empty. Set image-ref to the image the portal should pull (e.g. ghcr.io/acme/api:1.4.0)."
          exit 1
        fi
        # Body carries the source tag plus the ref (and PR number when present)
        # so the portal can apply DT-style ref-keyed retention. Empty values are
        # omitted so the portal falls back to its own defaults.
        body=$(jq -nc \
          --arg kind "$TOS_SCAN_KIND" \
          --arg ref "$TOS_REF" \
          --arg pr "$TOS_PR_NUMBER" \
          --arg image "$TOS_IMAGE_REF" \
          '{kind: $kind, metadata: (
              {source: "github-actions"}
              + (if $ref == "" then {} else {ref: $ref} end)
              + (if $pr  == "" then {} else {pull_request_number: ($pr | tonumber)} end)
              + (if $image == "" then {} else {image_ref: $image} end)
          )}')

        # `--fail-with-body` returns non-zero on 4xx/5xx but still prints the
        # response body so we can surface the RFC 7807 problem detail.
        # `-w "\n%{http_code}"` appends the status code on its own line, which
        # we split off below.
        # The portal allows one active scan per (project, ref), and rate-limits
        # triggers per key. Neither is a reason to fail a build outright, so
        # this loop handles both: 429 waits out Retry-After, and 409 attaches
        # to the scan already covering this ref instead of starting a second.
        headers="$(mktemp)"
        trap 'rm -f "${headers}"' EXIT
        scan_id=""
        attempt=0

        while [ -z "${scan_id}" ]; do
          attempt=$((attempt + 1))
          # `|| true` so a 4xx reaches the dispatch below instead of aborting
          # the step — the status code is what decides, not curl's exit.
          response=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${TOS_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -D "${headers}" \
            -w "\n%{http_code}" \
            "${api}/v1/projects/${TOS_PROJECT_ID}/scans" \
            -d "$body") || true

          http_code=$(echo "$response" | tail -n1)
          json_body=$(echo "$response" | sed '$d')

          case "${http_code}" in
            200|202)
              scan_id=$(echo "$json_body" | jq -er '.id')
              echo "TrustedOSS scan enqueued: ${scan_id}"
              ;;
            409)
              # Someone is already scanning this ref. The usual cause is this
              # workflow's own previous run: cancel-in-progress kills the
              # runner, but the scan it started keeps going server-side.
              scan_id=$(echo "$json_body" | jq -r '.active_scan_id // empty')
              if [ -z "${scan_id}" ]; then
                echo "::error::A scan is already active for this ref but the portal did not name it:"
                echo "${json_body}"
                exit 1
              fi
              echo "::notice::Attaching to the scan already running for this ref: ${scan_id}"
              ;;
            429)
              if [ "${attempt}" -ge 4 ]; then
                echo "::error::Still rate-limited after ${attempt} attempts:"
                echo "${json_body}"
                exit 1
              fi
              # Retry-After is seconds by contract; fall back if it is absent
              # or non-numeric so a malformed header cannot wedge the loop.
              wait_for=$(grep -i '^retry-after:' "${headers}" | tail -n1 | tr -d '\r' | awk '{print $2}')
              case "${wait_for}" in
                ''|*[!0-9]*) wait_for=60 ;;
              esac
              echo "::warning::Rate-limited by the portal; retrying in ${wait_for}s"
              sleep "${wait_for}"
              ;;
            *)
              echo "::error::Unexpected HTTP ${http_code} from scan trigger:"
              echo "${json_body}"
              exit 1
              ;;
          esac
        done

        echo "scan_id=${scan_id}" >> "$GITHUB_OUTPUT"

    # -------------------------------------------------------------------------
    # 2) Wait for terminal state — poll GET /v1/scans/{id} until status is
    #    succeeded | failed | cancelled, or the timeout elapses.
    # -------------------------------------------------------------------------
    - name: Wait for scan to finish
      id: wait
      shell: bash
      env:
        TOS_API_URL: ${{ inputs.api-url }}
        TOS_API_KEY: ${{ inputs.api-key }}
        TOS_SCAN_ID: ${{ steps.trigger.outputs.scan_id }}
        POLL_TIMEOUT: ${{ inputs.poll-timeout-seconds }}
        POLL_INTERVAL: ${{ inputs.poll-interval-seconds }}
      run: |
        set -euo pipefail
        api="${TOS_API_URL%/}"
        deadline=$(( $(date +%s) + POLL_TIMEOUT ))

        # A scan runs for tens of minutes, so a single blip — a proxy restart, a
        # brief 5xx — must not lose work that is nearly finished. Tolerate a few
        # consecutive failures and only give up when the portal stays
        # unreachable.
        consecutive_failures=0
        max_consecutive_failures=3

        while :; do
          if ! response=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${TOS_API_KEY}" \
            -H "Accept: application/json" \
            -w "\n%{http_code}" \
            "${api}/v1/scans/${TOS_SCAN_ID}"); then
            consecutive_failures=$((consecutive_failures + 1))
            if [ "${consecutive_failures}" -ge "${max_consecutive_failures}" ]; then
              echo "::error::GET /v1/scans/${TOS_SCAN_ID} failed ${consecutive_failures}x in a row:"
              echo "${response}"
              exit 1
            fi
            echo "::warning::Status poll failed (${consecutive_failures}/${max_consecutive_failures}); retrying"
            sleep "${POLL_INTERVAL}"
            continue
          fi

          http_code=$(echo "$response" | tail -n1)
          json_body=$(echo "$response" | sed '$d')

          if [ "$http_code" != "200" ]; then
            echo "::error::Unexpected HTTP ${http_code} from scan status:"
            echo "${json_body}"
            exit 1
          fi
          consecutive_failures=0

          scan_status=$(echo "$json_body" | jq -r '.status')
          progress=$(echo "$json_body" | jq -r '.progress_percent // 0')
          step=$(echo "$json_body" | jq -r '.current_step // "?"')
          echo "[$(date -u +%H:%M:%S)] status=${scan_status} progress=${progress}% step=${step}"

          case "$scan_status" in
            succeeded)
              echo "scan_status=succeeded" >> "$GITHUB_OUTPUT"
              break
              ;;
            failed|cancelled)
              # Surface the error_message so failures are debuggable from the
              # workflow log without opening the portal.
              err=$(echo "$json_body" | jq -r '.error_message // "(no error message)"')
              echo "::error::Scan ${TOS_SCAN_ID} ended with status=${scan_status}: ${err}"
              echo "scan_status=${scan_status}" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
            queued|running)
              # Continue polling.
              ;;
            *)
              echo "::warning::Unrecognized scan status '${scan_status}', continuing to poll"
              ;;
          esac

          if [ "$(date +%s)" -ge "$deadline" ]; then
            echo "::error::Scan ${TOS_SCAN_ID} did not finish within ${POLL_TIMEOUT}s (last status=${scan_status})."
            echo "::error::The portal is still running it — this step stopped waiting, it did not cancel the scan."
            echo "::error::Raise poll-timeout-seconds, or re-run once it finishes; a re-run started now would attach to it."
            exit 1
          fi

          sleep "${POLL_INTERVAL}"
        done

    # -------------------------------------------------------------------------
    # 3) Evaluate gate — GET /v1/projects/{id}/gate-result, expose as outputs.
    #    We DO NOT exit non-zero here even when gate=fail; the PR-comment step
    #    needs to run first so reviewers see the report alongside the failure.
    #    The "Apply gate result" step at the end is the single place that
    #    enforces fail-on-gate.
    #
    #    The `ref` query anchors the verdict to the branch this job scanned.
    #    Without it the portal answers with its MAIN LINE's newest succeeded
    #    scan, so a pull_request build that just waited out its own `pr-<n>`
    #    scan would be judged by `main` — a passing PR blocked by a critical
    #    CVE that only exists on the default branch, and vice versa. We send
    #    the same raw `github.ref` the trigger step sent; the portal applies
    #    one normalization to both, so the two always agree on the key.
    # -------------------------------------------------------------------------
    - name: Evaluate build gate
      id: gate
      shell: bash
      env:
        TOS_API_URL: ${{ inputs.api-url }}
        TOS_API_KEY: ${{ inputs.api-key }}
        TOS_PROJECT_ID: ${{ inputs.project-id }}
        TOS_REF: ${{ github.ref }}
        TOS_SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        set -euo pipefail
        api="${TOS_API_URL%/}"

        # --get + --data-urlencode rather than string concatenation: a ref like
        # `refs/heads/feature/oauth` carries slashes that must not be read as
        # extra path segments.
        gate_args=(--fail-with-body -sS
          -H "Authorization: Bearer ${TOS_API_KEY}"
          -H "Accept: application/json"
          -w "\n%{http_code}"
          --get "${api}/v1/projects/${TOS_PROJECT_ID}/gate-result")
        if [ -n "${TOS_REF}" ]; then
          gate_args+=(--data-urlencode "ref=${TOS_REF}")
        fi

        response=$(curl "${gate_args[@]}") || {
            echo "::error::GET /v1/projects/${TOS_PROJECT_ID}/gate-result failed:"
            echo "${response}"
            exit 1
          }

        http_code=$(echo "$response" | tail -n1)
        json_body=$(echo "$response" | sed '$d')

        if [ "$http_code" != "200" ]; then
          echo "::error::Unexpected HTTP ${http_code} from gate-result:"
          echo "${json_body}"
          exit 1
        fi

        gate=$(echo "$json_body" | jq -r '.gate')
        reason=$(echo "$json_body" | jq -r '.reason // ""')
        critical=$(echo "$json_body" | jq -r '.critical_cve_count // 0')
        forbidden=$(echo "$json_body" | jq -r '.forbidden_license_count // 0')
        malicious=$(echo "$json_body" | jq -r '.malicious_component_count // 0')
        malicious_assessed=$(echo "$json_body" | jq -r '.malicious_scan_assessed // false')
        epss=$(echo "$json_body" | jq -r '.epss_gate_count // 0')
        outcome=$(echo "$json_body" | jq -r '.component_outcome // ""')
        kev=$(echo "$json_body" | jq -r '.kev_gate_count // 0')
        kev_outcome=$(echo "$json_body" | jq -r '.kev_outcome // "not_configured"')
        eol=$(echo "$json_body" | jq -r '.eol_gate_count // 0')
        eol_outcome=$(echo "$json_body" | jq -r '.eol_outcome // "not_configured"')
        epss_outcome=$(echo "$json_body" | jq -r '.epss_outcome // ""')
        epss_threshold=$(echo "$json_body" | jq -r '.epss_threshold // ""')

        # SARIF export (ER29). Fetched with the same ref anchor as the verdict
        # above, so the document describes this branch rather than the
        # project's main line. Written whenever `sarif-file` is set, including
        # on a passing gate: code scanning only learns that a fixed alert is
        # gone from a run that no longer reports it, so skipping the upload on
        # green would leave stale alerts standing forever.
        sarif_file=""
        if [ -n "${TOS_SARIF_FILE}" ]; then
          sarif_args=(--fail-with-body -sS
            -H "Authorization: Bearer ${TOS_API_KEY}"
            -H "Accept: application/sarif+json"
            -w "\n%{http_code}"
            --get "${api}/v1/projects/${TOS_PROJECT_ID}/gate-result/sarif")
          if [ -n "${TOS_REF}" ]; then
            sarif_args+=(--data-urlencode "ref=${TOS_REF}")
          fi

          sarif_response=$(curl "${sarif_args[@]}") || {
              echo "::error::GET /v1/projects/${TOS_PROJECT_ID}/gate-result/sarif failed:"
              echo "${sarif_response}"
              exit 1
            }
          sarif_code=$(echo "$sarif_response" | tail -n1)
          sarif_body=$(echo "$sarif_response" | sed '$d')

          if [ "$sarif_code" != "200" ]; then
            echo "::error::Unexpected HTTP ${sarif_code} from gate-result/sarif:"
            echo "${sarif_body}"
            exit 1
          fi

          # Refuse to write something an upload would choke on. A truncated
          # body fails the step here, where the message names the cause, rather
          # than inside upload-sarif where it reads as a schema error.
          if ! echo "$sarif_body" | jq -e '.version == "2.1.0" and (.runs | length) > 0' >/dev/null; then
            echo "::error::gate-result/sarif returned a body that is not a SARIF 2.1.0 run:"
            echo "${sarif_body}" | head -c 2000
            exit 1
          fi

          mkdir -p "$(dirname "${TOS_SARIF_FILE}")"
          printf '%s' "$sarif_body" > "${TOS_SARIF_FILE}"
          sarif_file="${TOS_SARIF_FILE}"
          echo "wrote SARIF to ${TOS_SARIF_FILE} ($(echo "$sarif_body" | jq '.runs[0].results | length') results)"
        fi

        # GITHUB_OUTPUT supports multi-line via heredoc, but reason is single
        # line by contract — we still defensively strip newlines.
        reason_oneline=$(printf '%s' "$reason" | tr -d '\r\n')

        {
          echo "gate=${gate}"
          echo "reason=${reason_oneline}"
          echo "critical_cve_count=${critical}"
          echo "forbidden_license_count=${forbidden}"
          echo "malicious_component_count=${malicious}"
          echo "epss_gate_count=${epss}"
          echo "component_outcome=${outcome}"
          echo "kev_gate_count=${kev}"
          echo "kev_outcome=${kev_outcome}"
          echo "eol_gate_count=${eol}"
          echo "eol_outcome=${eol_outcome}"
          echo "epss_outcome=${epss_outcome}"
          echo "sarif_file=${sarif_file}"
        } >> "$GITHUB_OUTPUT"

        # Job summary block — visible on the workflow run page.
        {
          echo "## TRUSCA Gate"
          echo ""
          echo "| Field | Value |"
          echo "|---|---|"
          echo "| Verdict | **${gate}** |"
          echo "| Critical CVEs | ${critical} |"
          echo "| Forbidden licenses | ${forbidden} |"
          # Only shown when non-zero: a "Malicious packages | 0" row on every
          # passing build would read as an all-clear, and the count is 0 when
          # the axis is switched off too.
          if [ "${malicious}" != "0" ]; then
            echo "| Known-malicious packages | ${malicious} — remove, rotate credentials |"
          elif [ "${malicious_assessed}" != "true" ]; then
            # A zero nobody computed must not read like a clean result.
            echo "| Known-malicious packages | not assessed on this scan |"
          fi
          # A gate that passes on a scan which found no components passed
          # because there was nothing to judge. Reported unconditionally when
          # it happens, because every count above reads 0 either way and the
          # table would otherwise be indistinguishable from a clean build.
          # The EPSS axis reports 0 both when nothing scored above the
          # threshold and when nothing was scored at all. Only said when a
          # threshold is actually configured: on a deployment that never opted
          # in there is nothing to caveat.
          case "${epss_outcome}" in
            no_data)
              echo "| EPSS (>= ${epss_threshold}) | **not evaluated**. No open finding on this scan has an EPSS score, so the threshold you configured decided nothing. Set EPSS_REFRESH_ENABLED on the portal, or point EPSS_FEED_URL at a mirror. |"
              ;;
            partial)
              echo "| EPSS (>= ${epss_threshold}) | ${epss} over the threshold, but some open findings carry no EPSS score, so this count is not a complete answer. |"
              ;;
          esac
          # Only shown when the axis actually ran. A "Known-exploited | 0" row
          # on a deployment that never enabled KEV would read as an all-clear
          # for something nobody checked.
          if [ "${kev_outcome}" != "not_configured" ] && [ "${kev}" != "0" ]; then
            echo "| Known-exploited (CISA KEV) | ${kev} listed as being exploited in the wild; patch ahead of severity order |"
          fi
          case "${kev_outcome}" in
            no_data)
              echo "| Known-exploited (CISA KEV) | **not evaluated**. The KEV catalog has never synced on this portal, so every flag is a default rather than an answer. Enable KEV_REFRESH_ENABLED, or point KEV_FEED_URL at a mirror. |"
              ;;
            partial)
              echo "| Known-exploited (CISA KEV) | ${kev} listed, but some findings were discovered since the last catalog sync, so this count is not a complete answer. |"
              ;;
          esac
          if [ "${eol_outcome}" != "not_configured" ] && [ "${eol}" != "0" ]; then
            echo "| End of life | ${eol} component(s) past end of life, so no further security patches |"
          fi
          case "${eol_outcome}" in
            no_data)
              echo "| End of life | **not evaluated**. No component on this scan has been checked against the lifecycle catalog, so this axis judged nothing. |"
              ;;
            partial)
              echo "| End of life | ${eol} past end of life, but some components are not covered by the lifecycle catalog, so this count is not a complete answer. |"
              ;;
          esac
          case "${outcome}" in
            empty_no_manifests)
              echo "| Components | **none found**. No dependency manifest in this tree, so nothing was scanned. Verify TRUSCA supports this build system before treating the verdict as a pass. |"
              ;;
            empty_with_manifests)
              echo "| Components | **none found**. The tree carries dependency manifests, so this is a scan failure rather than an empty project. Check the scan log before relying on this verdict. |"
              ;;
          esac
          if [ -n "${reason_oneline}" ]; then
            echo "| Reason | ${reason_oneline} |"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        echo "TrustedOSS gate=${gate} critical=${critical} forbidden=${forbidden} malicious=${malicious} components=${outcome:-unknown}"

        case "${epss_outcome}" in
          no_data)
            # Warning, not a failure: whether an undecided EPSS axis should
            # block is the portal's GATE_EPSS_ON_MISSING_DATA policy to make,
            # and it has already made it by the time this verdict arrives.
            echo "::warning title=TRUSCA could not evaluate the EPSS gate::A threshold of ${epss_threshold} is configured, but no open finding on this scan carries an EPSS score, so 'epss-gate-count=0' means the axis judged nothing rather than that nothing was risky."
            ;;
          partial)
            echo "::warning title=TRUSCA evaluated the EPSS gate on partial data::Some open findings on this scan carry no EPSS score, so 'epss-gate-count=${epss}' counts only the findings that had one."
            ;;
        esac

        case "${kev_outcome}" in
          no_data)
            # Warning, not a failure: whether an undecided axis blocks is the
            # portal's GATE_KEV_ON_MISSING_DATA policy, already applied by the
            # time this verdict arrives.
            echo "::warning title=TRUSCA could not evaluate the KEV gate::The KEV axis is enabled but the catalog has never synced on this portal, so 'kev-gate-count=0' means the axis judged nothing rather than that nothing is being exploited."
            ;;
          partial)
            echo "::warning title=TRUSCA evaluated the KEV gate on partial data::Some findings on this scan were discovered since the last KEV catalog sync, so 'kev-gate-count=${kev}' counts only the findings the sync has reconciled."
            ;;
        esac

        case "${eol_outcome}" in
          no_data)
            echo "::warning title=TRUSCA could not evaluate the end-of-life gate::The end-of-life axis is enabled but no component on this scan has been checked against the lifecycle catalog, so 'eol-gate-count=0' means the axis judged nothing."
            ;;
          partial)
            echo "::warning title=TRUSCA evaluated the end-of-life gate on partial data::Some components on this scan are not covered by the lifecycle catalog, so 'eol-gate-count=${eol}' counts only the components that have an answer."
            ;;
        esac

        case "${outcome}" in
          empty_no_manifests|empty_with_manifests)
            # A warning annotation, not a failure: for a build system the
            # scanner cannot read, an empty result is the correct answer and
            # failing here would break a working pipeline.
            echo "::warning title=TRUSCA found no components::The gate verdict is '${gate}', but this scan produced no components (${outcome}). Every count it reports is 0 for that reason, not because the project is clean."
            ;;
        esac

    # -------------------------------------------------------------------------
    # 4) Post PR comment — only on pull_request events, only when caller
    #    opted in. The endpoint is idempotent on the server side (it updates
    #    an existing comment for the same scan/PR pair instead of duplicating).
    # -------------------------------------------------------------------------
    - name: Post SCA report to PR
      id: comment
      if: github.event_name == 'pull_request' && inputs.post-pr-comment == 'true'
      shell: bash
      env:
        TOS_API_URL: ${{ inputs.api-url }}
        TOS_API_KEY: ${{ inputs.api-key }}
        TOS_SCAN_ID: ${{ steps.trigger.outputs.scan_id }}
        REPO_FULL_NAME: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        api="${TOS_API_URL%/}"
        body=$(jq -nc \
          --arg repo "$REPO_FULL_NAME" \
          --argjson pr "$PR_NUMBER" \
          '{repo_full_name: $repo, pr_number: $pr, dry_run: false}')

        response=$(curl --fail-with-body -sS -X POST \
          -H "Authorization: Bearer ${TOS_API_KEY}" \
          -H "Content-Type: application/json" \
          -H "Accept: application/json" \
          -w "\n%{http_code}" \
          "${api}/v1/scans/${TOS_SCAN_ID}/post-pr-comment" \
          -d "$body") || {
            # Non-fatal: PR comments are advisory. Failing the whole gate
            # because GitHub.com had a 5xx blip would be a poor trade.
            echo "::warning::POST /v1/scans/${TOS_SCAN_ID}/post-pr-comment failed:"
            echo "${response}"
            exit 0
          }

        http_code=$(echo "$response" | tail -n1)
        json_body=$(echo "$response" | sed '$d')

        if [ "$http_code" != "200" ]; then
          echo "::warning::Unexpected HTTP ${http_code} from post-pr-comment (advisory step, continuing):"
          echo "${json_body}"
          exit 0
        fi

        status_value=$(echo "$json_body" | jq -r '.status')
        url=$(echo "$json_body" | jq -r '.comment_url // ""')
        echo "PR comment ${status_value}${url:+ — $url}"

    # -------------------------------------------------------------------------
    # 5) Apply gate result — single place that decides whether the job fails.
    #    This must be the last step so the PR comment goes out first.
    # -------------------------------------------------------------------------
    - name: Apply gate verdict
      if: inputs.fail-on-gate == 'true' && steps.gate.outputs.gate == 'fail'
      shell: bash
      env:
        REASON: ${{ steps.gate.outputs.reason }}
        CRITICAL: ${{ steps.gate.outputs.critical_cve_count }}
        FORBIDDEN: ${{ steps.gate.outputs.forbidden_license_count }}
      run: |
        echo "::error::TrustedOSS gate FAILED — critical_cve_count=${CRITICAL}, forbidden_license_count=${FORBIDDEN}. Reason: ${REASON:-(none)}"
        exit 1
