name: docs-uat

# docs-uat — procedural-correctness lane for the documentation: it proves
# that following a doc step-by-step actually works (the docs ARE the tests).
#
# Phase A covers the Quickstart vertical: annotation extraction + coverage
# lint, plus an end-to-end gate that brings the dev stack up via the documented
# commands, seeds the demo dataset, and drives the documented UI.
# Phase B adds the nightly tier: admin-guide api/sql assertions (audit-log)
# against the same dev stack. Phases C-D enroll user-guide / install / CI docs.
# Design rationale is kept with the internal docs.
#
# BLOCKING since 2026-08-13. Every job ran `continue-on-error: true` while the
# manifest fidelity settled; the condition that was waiting for is met (fifteen
# consecutive runs, two of them scheduled, with no failing step), so the lane
# now fails the run that breaks it. A job that cannot fail measures nothing.
#
# The scheduled tier has no pull request to show a red X on, so `nightly-alert`
# turns a failed scheduled run into a tracked issue — same pattern as ci.yml
# and verify-specs-nightly.yml.

on:
  pull_request:
    paths:
      - "docs-site/docs/**"
      - "docs-site/i18n/ko/docusaurus-plugin-content-docs/current/**"
      - "tools/docs-uat/**"
      - "apps/frontend/playwright.docs-uat.config.ts"
      - "apps/frontend/tests/docs-uat/**"
      - ".github/workflows/docs-uat.yml"
  workflow_dispatch:
  schedule:
    # Nightly 05:00 UTC — runs the nightly-tier admin-guide assertions.
    - cron: "0 5 * * *"

permissions:
  contents: read
  # The nightly jobs pull the dev images rather than rebuilding them — see
  # .github/actions/dev-images. quickstart-gate deliberately does not: it
  # verifies that the commands the Quickstart prints work on a clean machine,
  # and a reader following that page has no images waiting for them.
  packages: read

concurrency:
  group: docs-uat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Static: extract annotations → manifest, enforce coverage/schema/KO parity.
  #    Fast, no stack. Catches doc-vs-test drift on every PR.
  extract-and-lint:
    name: extract-and-lint (static)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Extract manifest + lint
        run: node tools/docs-uat/extract.mjs --lint

  # ── End-to-end: drive the documented Quickstart against the dev stack.
  quickstart-gate:
    name: quickstart-gate (dev compose)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Project standard (CLAUDE.md rule #10): docker-compose V1. Ubuntu 22.04
      # runners ship V2 only — install the pinned V1 release so the gate
      # exercises the documented `docker-compose` (hyphenated) invocation.
      - name: Install docker-compose V1
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" \
            -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend deps (for the ui-step Playwright run)
        working-directory: apps/frontend
        run: npm ci

      # Keyed off the lockfile, not a literal version — see ci.yml's copy of
      # this step for what a stale literal key does.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright (chromium only)
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      # Quickstart §1's `git clone` / `cd` is waived in CI (we're already in
      # the checked-out tree, ctx=ci-uses-checkout-tree). The doc's
      # `cp .env.example .env` IS the env bootstrap, so we do it here; the
      # workspace mount dir matches docker-compose.dev.yml.
      - name: Bootstrap env (stands in for the waived clone step)
        run: |
          cp .env.example .env
          mkdir -p workspace

      # run.mjs executes the documented gate-tier steps in order: migrate
      # (`run --rm backend alembic upgrade head`, since the dev image does not
      # auto-migrate), `up -d`, poll /health/ready, `seed_demo`, drive the
      # documented UI via Playwright, then the doc's `down`.
      - name: Run Quickstart gate (docs-uat)
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          DOCS_UAT_API_BASE: http://localhost:8000
          COMPOSE_DOCKER_CLI_BUILD: "1"
          DOCKER_BUILDKIT: "1"
          # docs-uat signs in once per doc (each run.mjs spawns a fresh browser),
          # so a multi-doc job easily exceeds the 5/min/IP login cap. Lift it for
          # the throwaway test stack (docker-compose.dev.yml passes it through;
          # mirrors the e2e workflow's RATELIMIT_DISABLED=1).
          RATELIMIT_DISABLED: "1"
        run: node tools/docs-uat/run.mjs --tier=gate --doc=quickstart.md

      - name: Dump compose logs on failure
        if: failure()
        run: |
          docker-compose -f docker-compose.dev.yml ps || true
          docker-compose -f docker-compose.dev.yml logs --tail=300 || true

      - name: Tear down
        if: always()
        run: docker-compose -f docker-compose.dev.yml down -v || true

  # ── Nightly tier: admin-guide api/sql assertions against the dev stack.
  #    Runs on schedule + manual dispatch (not on every PR — keeps PR CI lean;
  #    PRs still get extract-and-lint + quickstart-gate). Phase B enrolls
  #    audit-log.md (authed audit API + a jsonb diff query); later phases add
  #    more docs to the --doc list.
  docs-uat-nightly:
    name: docs-uat-nightly (dev compose)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      # admin-guide/vulnerability-data.md's Path B assertion (E3) briefly
      # brings up docker-compose.yml's worker-scan/worker-default alongside
      # this dev stack - see docker-compose.docs-uat-workers.yml. Pinning the
      # project name here makes the dev stack's default network resolvable
      # (as `trustedoss_default`) from that overlay, and matches the doc's
      # own "under default docker-compose naming (project prefix trustedoss)"
      # volume-naming note.
      COMPOSE_PROJECT_NAME: trustedoss
    steps:
      - uses: actions/checkout@v4

      - name: Install docker-compose V1
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" \
            -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Same bootstrap the Quickstart documents (migrate-before-up so the
      # health-gated worker doesn't block `up` under compose V1), but inline
      # here because the nightly assertions live in a different doc than the
      # bootstrap commands.
      - name: Pre-build dev images
        uses: ./.github/actions/dev-images
        with:
          services: backend celery-worker frontend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap dev stack + seed
        env:
          COMPOSE_DOCKER_CLI_BUILD: "1"
          DOCKER_BUILDKIT: "1"
          # docs-uat signs in once per doc (each run.mjs spawns a fresh browser),
          # so a multi-doc job easily exceeds the 5/min/IP login cap. Lift it for
          # the throwaway test stack (docker-compose.dev.yml passes it through;
          # mirrors the e2e workflow's RATELIMIT_DISABLED=1).
          RATELIMIT_DISABLED: "1"
        run: |
          set -euo pipefail
          cp .env.example .env
          mkdir -p workspace
          docker-compose -f docker-compose.dev.yml up -d postgres redis
          for i in $(seq 1 20); do
            cid=$(docker-compose -f docker-compose.dev.yml ps -q postgres)
            st=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo none)
            [ "$st" = "healthy" ] && break
            echo "waiting for postgres ($i/20)"; sleep 3
          done
          docker-compose -f docker-compose.dev.yml run --rm -T backend alembic upgrade head
          docker-compose -f docker-compose.dev.yml up -d
          for i in $(seq 1 40); do
            curl -fsS http://localhost:8000/health/ready >/dev/null 2>&1 && break
            echo "waiting for /health/ready ($i/40)"; sleep 6
          done
          docker-compose -f docker-compose.dev.yml exec -T backend python -m scripts.seed_demo

      - name: Run nightly assertions — admin-guide/audit-log.md
        env:
          DOCS_UAT_API_BASE: http://localhost:8000
        run: node tools/docs-uat/run.mjs --tier=nightly --doc=admin-guide/audit-log.md

      # admin-guide/backup-and-restore.md is enrolled for coverage / KO parity /
      # drift via extract-and-lint, but has no docs-uat-executed steps: backup.sh
      # is a production-operator tool (hardcodes docker-compose.yml) and its
      # backup→restore round-trip is already executed by install-uat.yml. So
      # there is intentionally no run step for it here.

      - name: Run nightly assertions — admin-guide/disk-and-health.md
        env:
          DOCS_UAT_API_BASE: http://localhost:8000
        run: node tools/docs-uat/run.mjs --tier=nightly --doc=admin-guide/disk-and-health.md

      - name: Run nightly assertions — admin-guide/users-and-teams.md
        env:
          DOCS_UAT_API_BASE: http://localhost:8000
        run: node tools/docs-uat/run.mjs --tier=nightly --doc=admin-guide/users-and-teams.md

      # admin-guide/vulnerability-data.md's Path B doc steps run literal
      # `docker-compose -f docker-compose.yml stop/start worker-scan
      # worker-default` (the production worker split - docker-compose.dev.yml
      # only has one `celery-worker`, so those container names would
      # otherwise never exist on this stack). Pre-create the two containers
      # with docker-compose.docs-uat-workers.yml (reuses the already-built dev
      # worker image) so the doc's own `-f docker-compose.yml` stop/start
      # commands - run unmodified by run.mjs - find real containers under
      # COMPOSE_PROJECT_NAME=trustedoss (set at the job level) to act on.
      # `--no-deps` so this never touches docker-compose.yml's own postgres/
      # redis/backend service definitions. `up` creates docker-compose.yml's
      # own real `trustedoss` network (needed so the doc's later unmodified
      # `start` command - no override file - can resolve it too; run
      # 33290316834 hit "network trustedoss not found" when this network was
      # instead redirected onto the dev stack's network via `external:`), so
      # `docker network connect` joins the dev stack's already-running
      # postgres/redis containers onto it afterwards.
      - name: Start production worker-scan/worker-default (vulnerability-data.md Path B)
        run: |
          set -euo pipefail
          docker-compose -f docker-compose.yml -f docker-compose.docs-uat-workers.yml \
            up -d --no-deps worker-scan worker-default
          docker network connect --alias postgres trustedoss \
            "$(docker-compose -f docker-compose.dev.yml ps -q postgres)"
          docker network connect --alias redis trustedoss \
            "$(docker-compose -f docker-compose.dev.yml ps -q redis)"
          echo "waiting for worker-scan and worker-default healthy..."
          for i in $(seq 1 30); do
            scan_healthy=$(docker-compose -f docker-compose.yml -f docker-compose.docs-uat-workers.yml ps worker-scan | grep -c healthy || true)
            default_healthy=$(docker-compose -f docker-compose.yml -f docker-compose.docs-uat-workers.yml ps worker-default | grep -c healthy || true)
            if [ "$scan_healthy" -ge 1 ] && [ "$default_healthy" -ge 1 ]; then
              echo "worker-scan and worker-default healthy"; break
            fi
            echo "waiting for worker-scan/worker-default ($i/30)"; sleep 5
          done
          docker-compose -f docker-compose.yml -f docker-compose.docs-uat-workers.yml ps worker-scan worker-default

      - name: Run nightly assertions — admin-guide/vulnerability-data.md
        env:
          DOCS_UAT_API_BASE: http://localhost:8000
        run: node tools/docs-uat/run.mjs --tier=nightly --doc=admin-guide/vulnerability-data.md

      # Mirrors the doc's own container/network lifecycle: stop+remove the
      # two containers (unmodified `-f docker-compose.yml`, no override file
      # needed for stop/rm), unplug the dev stack's postgres/redis from the
      # `trustedoss` network, then remove that network so it does not linger
      # for the rest of the job.
      #
      # `-t 30`: worker-scan/worker-default's production `stop_grace_period`
      # (4200s/3900s, docker-compose.yml) applies to `stop` here too since
      # this step deliberately drops the docs-uat-workers.yml overlay (whose
      # shortened stop_grace_period only exists for `up`, which built these
      # containers). Without an explicit timeout, `docker-compose stop`
      # blocked past the job's 25-minute timeout waiting out that grace
      # period (run 33291293513) - pass it on the command line instead of
      # re-adding the overlay file.
      - name: Stop production worker-scan/worker-default (cleanup)
        if: always()
        run: |
          docker-compose -f docker-compose.yml \
            stop -t 30 worker-scan worker-default || true
          docker-compose -f docker-compose.yml \
            rm -f worker-scan worker-default || true
          docker network disconnect trustedoss \
            "$(docker-compose -f docker-compose.dev.yml ps -q postgres)" || true
          docker network disconnect trustedoss \
            "$(docker-compose -f docker-compose.dev.yml ps -q redis)" || true
          docker network rm trustedoss || true

      - name: Run nightly assertions — user-guide/sbom.md
        env:
          DOCS_UAT_API_BASE: http://localhost:8000
        run: node tools/docs-uat/run.mjs --tier=nightly --doc=user-guide/sbom.md

      - name: Dump compose logs on failure
        if: failure()
        run: |
          docker-compose -f docker-compose.dev.yml ps || true
          docker-compose -f docker-compose.dev.yml logs --tail=300 || true
          # worker-scan/worker-default (docker-compose.yml, brought up for
          # vulnerability-data.md Path B above) are usually already stopped
          # and removed by the cleanup step by the time this runs - `|| true`
          # covers both that and a genuine failure in the bring-up itself.
          docker-compose -f docker-compose.yml -f docker-compose.docs-uat-workers.yml ps worker-scan worker-default || true
          docker-compose -f docker-compose.yml -f docker-compose.docs-uat-workers.yml logs --tail=300 worker-scan worker-default || true

      - name: Tear down
        if: always()
        run: docker-compose -f docker-compose.dev.yml down -v || true

  # ── Nightly tier (UI): user-guide "Verify it worked" steps driven through
  #    Playwright. Separate from docs-uat-nightly because UI steps need the
  #    frontend deps + a browser; the api/sql nightly job stays lean.
  docs-uat-nightly-ui:
    name: docs-uat-nightly-ui (dev compose)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install docker-compose V1
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" \
            -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend deps (for the ui-step Playwright run)
        working-directory: apps/frontend
        run: npm ci

      # Keyed off the lockfile, not a literal version — see ci.yml's copy of
      # this step for what a stale literal key does.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright (chromium only)
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      - name: Pre-build dev images
        uses: ./.github/actions/dev-images
        with:
          services: backend celery-worker frontend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap dev stack + seed
        env:
          COMPOSE_DOCKER_CLI_BUILD: "1"
          DOCKER_BUILDKIT: "1"
          # docs-uat signs in once per doc (each run.mjs spawns a fresh browser),
          # so a multi-doc job easily exceeds the 5/min/IP login cap. Lift it for
          # the throwaway test stack (docker-compose.dev.yml passes it through;
          # mirrors the e2e workflow's RATELIMIT_DISABLED=1).
          RATELIMIT_DISABLED: "1"
        run: |
          set -euo pipefail
          cp .env.example .env
          mkdir -p workspace
          docker-compose -f docker-compose.dev.yml up -d postgres redis
          for i in $(seq 1 20); do
            cid=$(docker-compose -f docker-compose.dev.yml ps -q postgres)
            st=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo none)
            [ "$st" = "healthy" ] && break
            echo "waiting for postgres ($i/20)"; sleep 3
          done
          docker-compose -f docker-compose.dev.yml run --rm -T backend alembic upgrade head
          docker-compose -f docker-compose.dev.yml up -d
          for i in $(seq 1 40); do
            curl -fsS http://localhost:8000/health/ready >/dev/null 2>&1 && break
            echo "waiting for /health/ready ($i/40)"; sleep 6
          done
          docker-compose -f docker-compose.dev.yml exec -T backend python -m scripts.seed_demo

      - name: Run nightly UI assertions — user-guide/components-and-licenses.md
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          DOCS_UAT_API_BASE: http://localhost:8000
        run: node tools/docs-uat/run.mjs --tier=nightly --doc=user-guide/components-and-licenses.md

      - name: Run nightly UI assertions — user-guide/dashboard.md
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          DOCS_UAT_API_BASE: http://localhost:8000
        run: node tools/docs-uat/run.mjs --tier=nightly --doc=user-guide/dashboard.md

      - name: Run nightly UI assertions — user-guide/scans.md
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          DOCS_UAT_API_BASE: http://localhost:8000
        run: node tools/docs-uat/run.mjs --tier=nightly --doc=user-guide/scans.md

      - name: Run nightly UI assertions — user-guide/auth-and-profile.md
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          DOCS_UAT_API_BASE: http://localhost:8000
        run: node tools/docs-uat/run.mjs --tier=nightly --doc=user-guide/auth-and-profile.md

      - name: Run nightly UI assertions — user-guide/notifications.md
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          DOCS_UAT_API_BASE: http://localhost:8000
        run: node tools/docs-uat/run.mjs --tier=nightly --doc=user-guide/notifications.md

      - name: Run nightly UI assertions — user-guide/vulnerabilities.md
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          DOCS_UAT_API_BASE: http://localhost:8000
        run: node tools/docs-uat/run.mjs --tier=nightly --doc=user-guide/vulnerabilities.md

      - name: Run nightly UI assertions — user-guide/approvals.md
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          DOCS_UAT_API_BASE: http://localhost:8000
        run: node tools/docs-uat/run.mjs --tier=nightly --doc=user-guide/approvals.md

      - name: Run nightly UI assertions — user-guide/projects.md
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          DOCS_UAT_API_BASE: http://localhost:8000
        run: node tools/docs-uat/run.mjs --tier=nightly --doc=user-guide/projects.md

      - name: Dump compose logs on failure
        if: failure()
        run: |
          docker-compose -f docker-compose.dev.yml ps || true
          docker-compose -f docker-compose.dev.yml logs --tail=300 || true

      - name: Tear down
        if: always()
        run: docker-compose -f docker-compose.dev.yml down -v || true

  # ── Nightly tier: Helm chart validation (helm lint + template) for
  #    installation/helm.md. Lightweight — no compose stack, just Helm 3 +
  #    Node. Per the Phase D decision, the chart is validated statically
  #    (lint + full template render with the minimum required --set values);
  #    real `kind` cluster deploys were declined as too heavy / flaky.
  docs-uat-nightly-helm:
    name: docs-uat-nightly-helm (chart validate)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Helm 3
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4.3.1
        with:
          version: v3.16.2

      - name: Run nightly chart-validate assertion — installation/helm.md
        run: node tools/docs-uat/run.mjs --tier=nightly --doc=installation/helm.md

  # ── A scheduled run has no pull request to show a red X on. Turn a failure
  #    into a tracked issue instead, and close it when the lane goes green.
  #    Every job is watched, not just the nightly tier: extract-and-lint and
  #    quickstart-gate carry no `if`, so the schedule runs them too.
  nightly-alert:
    name: nightly-alert
    if: ${{ always() && github.event_name == 'schedule' }}
    needs:
      - extract-and-lint
      - quickstart-gate
      - docs-uat-nightly
      - docs-uat-nightly-ui
      - docs-uat-nightly-helm
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/nightly-failure-issue
      - uses: ./.github/actions/nightly-failure-issue
        with:
          label: nightly-docs-uat
          title: "Nightly docs-uat is failing"
          failed: ${{ contains(needs.*.result, 'failure') && 'true' || 'false' }}
          details: |
            A documented step no longer does what the document says it does.
            The run log names the doc and the assertion; `tools/docs-uat/`
            maps both back to the annotation in the guide.

            The document is the oracle here. Either the product drifted from
            what the guide promises, or the guide promises something the
            product never did — decide which before changing either side.
          token: ${{ secrets.GITHUB_TOKEN }}
