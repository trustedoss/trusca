name: golden-nightly

# Real-tool regression gate. Each shard brings up its own ephemeral stack with
# the real cdxgen / scancode / Trivy worker, scans the in-repo golden fixtures
# (apps/backend/tests/e2e/golden/fixtures/) and diffs the normalised output
# against the committed baselines.
#
# NOT a PR gate: a real scan plus the worker's Trivy-DB bootstrap is minutes per
# shard. Validate changes by dispatching this workflow on the branch first.
#
# History: the previous nightly was deleted in 7c98b8a. Its cron had been
# commented out since it was written, it composed a compose file that did not
# exist, and it never ran once, so the `golden` marker and its baselines had no
# caller. GOLDEN_STRICT=1 below keeps that failure mode closed: an unreachable
# stack or a missing fixture fails the case instead of skipping it.
#
# Baselines are regenerated here, never on a laptop (local seed data and tool
# versions differ). Dispatch with update_baselines=true, download the artifact,
# and review the diff in the PR.
#
# Advisory data is pinned (issue #549). The worker scans with the Trivy
# database whose db.tar.gz sha256 is recorded in
# apps/backend/tests/e2e/golden/trivy-db.lock.json. The tarball is kept in
# this repository's Actions cache only (key golden-trivy-db-<sha256>), never
# published anywhere. Each shard restores it by exact key, verifies the
# sha256, and seeds it into the worker's cache volume before the worker
# starts; compose.trivy-db.yml keeps the worker from downloading the live
# database. A new advisory against a fixture pin therefore cannot move a
# baseline, while the findings themselves are part of the diff, so a matcher
# that stops reporting a component still fails the gate.
#
# A cache miss fails the shard; there is no fallback to the live database.
# GitHub evicts a cache entry unused for 7 days; the nightly restores it every
# day, so it only lapses after a pause of a week or more. Cache entries are
# also scoped: a run on main cannot read an entry saved by a run on another
# branch. Recovery, both dispatched on main:
# - refresh_trivy_db=true downloads the current upstream database, saves it
#   under its own key, and regenerates every shard's baselines against it.
#   Commit the lock artifact and the baselines together.
# - reseed_trivy_db=true downloads the locked upstream digest again and
#   saves it under the locked key, if upstream still serves those exact bytes.
#   No baseline changes.
#
# Shadow run (dispatch with shadow=true): measures the BomLens scan engine
# against the in-process one instead of diffing baselines. Each shard scans its
# fixtures with the in-process engine, switches the same stack to the BomLens
# engine (compose.bomlens.yml) and scans them again; both passes read one Trivy
# database. The shadow-report job turns the captures into a difference table
# (job summary and artifact). Nothing in a shadow run fails on a difference.
# The golden-containers job runs in the same dispatch only: it scans the
# container images in container_images.json with both engines
# (SCAN_CONTAINER_ENGINE) and its captures join the same report.

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 KST, clear of verify-specs-nightly (17:30 UTC)
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Rewrite the shard's baselines and upload them as an artifact instead of diffing"
        type: boolean
        default: false
      shadow:
        description: "Scan with the in-process and the BomLens engine and report the differences, instead of diffing baselines"
        type: boolean
        default: false
      refresh_trivy_db:
        description: "Download today's Trivy database into the Actions cache and regenerate every baseline against it"
        type: boolean
        default: false
      reseed_trivy_db:
        description: "Put the locked Trivy database back into the Actions cache from its upstream digest (after eviction, or on main after a refresh ran elsewhere)"
        type: boolean
        default: false

permissions:
  contents: read
  # The dev images are pulled from ghcr rather than rebuilt: see
  # .github/actions/dev-images.
  packages: read

env:
  # Where a refresh reads the database from. Downloaded only; the copy lives
  # in this repository's Actions cache, not in any registry.
  TRIVY_DB_UPSTREAM: ghcr.io/aquasecurity/trivy-db:2
  TRIVY_DB_LOCK: apps/backend/tests/e2e/golden/trivy-db.lock.json
  TRIVY_DB_CACHE_PATH: /tmp/golden-trivy-db

jobs:
  # Dispatch with refresh_trivy_db=true or reseed_trivy_db=true only. Puts a
  # database tarball into the Actions cache under golden-trivy-db-<sha256>.
  # On a refresh it hands the new sha256 to the shards, which regenerate their
  # baselines against it.
  trivy-db-snapshot:
    name: trivy-db snapshot
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.refresh_trivy_db == 'true' || github.event.inputs.reseed_trivy_db == 'true') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.fetch.outputs.sha256 }}
    env:
      REFRESH: ${{ github.event.inputs.refresh_trivy_db || 'false' }}
      RESEED: ${{ github.event.inputs.reseed_trivy_db || 'false' }}
      SHADOW: ${{ github.event.inputs.shadow || 'false' }}
    steps:
      - name: Refuse conflicting inputs
        run: |
          if [ "$REFRESH" = "true" ] && [ "$RESEED" = "true" ]; then
            echo "::error::refresh_trivy_db and reseed_trivy_db are exclusive"
            exit 1
          fi
          if [ "$SHADOW" = "true" ]; then
            echo "::error::dispatch the shadow run separately"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/backend/tests/e2e/golden

      - name: Set up ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6  # v1.2.4
        with:
          version: 1.2.0

      - name: Download the database
        id: fetch
        run: |
          set -euo pipefail
          if [ "$RESEED" = "true" ]; then
            source_ref="$(jq -r .source "$TRIVY_DB_LOCK")"
            want="$(jq -r .sha256 "$TRIVY_DB_LOCK")"
          else
            source_ref="${TRIVY_DB_UPSTREAM%:*}@$(oras resolve "$TRIVY_DB_UPSTREAM")"
            want=""
          fi
          echo "source: $source_ref"
          oras pull "$source_ref" --output "$TRIVY_DB_CACHE_PATH"
          sha="$(sha256sum "$TRIVY_DB_CACHE_PATH/db.tar.gz" | cut -d' ' -f1)"
          if [ -n "$want" ] && [ "$sha" != "$want" ]; then
            echo "::error::$source_ref no longer yields the locked database (sha256 $sha, lock $want). Dispatch refresh_trivy_db=true instead."
            exit 1
          fi
          updated="$(tar -xzOf "$TRIVY_DB_CACHE_PATH/db.tar.gz" metadata.json | jq -r .UpdatedAt)"
          mkdir -p lock
          jq -n --arg sha "$sha" --arg source "$source_ref" --arg updated "$updated" \
            '{sha256: $sha, source: $source, db_updated_at: $updated}' > lock/trivy-db.lock.json
          cat lock/trivy-db.lock.json
          {
            echo "### Golden Trivy database"
            echo
            if [ "$REFRESH" = "true" ]; then
              echo "Commit as $TRIVY_DB_LOCK together with the regenerated baselines:"
            else
              echo "Reseeded the cache entry for the committed lock:"
            fi
            echo
            echo '```json'
            cat lock/trivy-db.lock.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Save the database in the Actions cache
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TRIVY_DB_CACHE_PATH }}/db.tar.gz
          key: golden-trivy-db-${{ steps.fetch.outputs.sha256 }}

      - name: Upload the lock file
        if: env.REFRESH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: golden-trivy-db-lock
          path: lock/trivy-db.lock.json
          if-no-files-found: error

  golden:
    name: golden (${{ matrix.shard }})
    needs: trivy-db-snapshot
    # The snapshot job is skipped on every run but a refresh or reseed;
    # skipped is fine, failed is not (the shards would read a stale pin).
    # A reseed only fills the cache, so the gate runs after it as usual.
    if: ${{ !cancelled() && needs.trivy-db-snapshot.result != 'failure' }}
    runs-on: ubuntu-22.04
    # A shadow run scans every fixture twice and pulls the engine images.
    timeout-minutes: ${{ github.event.inputs.shadow == 'true' && 120 || 40 }}
    strategy:
      # One ecosystem drifting must not hide another, so shards run to the end.
      fail-fast: false
      matrix:
        include:
          # `names` is the set of baselines each shard owns. Every baseline
          # belongs to exactly one shard and has an in-repo fixture;
          # tests/unit/test_golden_gate_contract.py enforces both.
          - shard: node
            names: "node node-yarn"
          - shard: python
            names: "python-pip python-poetry"
          - shard: jvm
            names: "maven gradle gradle-kts"
          - shard: native
            names: "go rust ruby"
          - shard: multi
            names: "multi-component"
          - shard: scancode
            names: "scancode-license-files scancode-license-headers scancode-mixed-policy scancode-spdx-tags"
    env:
      # Dev stack plus the scancode and pinned-database overrides (see those
      # files for why).
      COMPOSE_FILE: docker-compose.dev.yml:apps/backend/tests/e2e/golden/compose.scancode.yml:apps/backend/tests/e2e/golden/compose.trivy-db.yml
      # Read by compose.trivy-db.yml: only a shadow run downloads the live
      # database; the gate and a baseline update read the pinned snapshot.
      GOLDEN_LIVE_TRIVY_DB: ${{ github.event.inputs.shadow == 'true' && 'true' || 'false' }}
      # Set on a refresh or reseed dispatch; only a refresh (which also sets
      # UPDATE_BASELINES) uses it instead of the lock file.
      TRIVY_DB_REFRESH_SHA256: ${{ needs.trivy-db-snapshot.outputs.sha256 }}
      TRUSTEDOSS_SCAN_BACKEND: real
      # Pin so the api and worker sign and verify the same JWTs.
      SECRET_KEY: golden-nightly-fixture-secret-key-for-workflow-runs
      RATELIMIT_DISABLED: "1"
      LOGIN_THROTTLE_ENABLED: "false"
      # Matrix and dispatch values pass through env, never inline in run:.
      GOLDEN_NAMES: ${{ matrix.names }}
      # A database refresh always re-records the baselines against the copy.
      UPDATE_BASELINES: ${{ (github.event.inputs.update_baselines == 'true' || github.event.inputs.refresh_trivy_db == 'true') && 'true' || 'false' }}
      SHADOW: ${{ github.event.inputs.shadow || 'false' }}
      GOLDEN_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4

      # The engine images and the language images stage 1 pulls come on top
      # of the dev images; the runner's preinstalled SDKs are not used here.
      - name: "Shadow: free runner disk"
        if: env.SHADOW == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Project standard (CLAUDE.md rule #10): docker-compose V1. Ubuntu
      # runners ship V2 only.
      - name: Install docker-compose V1
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" \
            -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Bootstrap env
        run: |
          cp .env.example .env
          mkdir -p workspace

      - name: Pre-build dev images
        uses: ./.github/actions/dev-images
        with:
          services: backend celery-worker
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---- Pinned Trivy database (every run but a shadow run) -------------
      # Restored from the Actions cache by the exact key the lock names (no
      # restore-keys, so nothing else can match), checked against the lock's
      # sha256, and unpacked into the worker's trivy-cache volume before the
      # worker starts. compose.trivy-db.yml then keeps the worker off the
      # network for advisory data.
      - name: Resolve the pinned Trivy database
        id: trivydb
        if: env.SHADOW != 'true'
        run: |
          set -euo pipefail
          sha="${TRIVY_DB_REFRESH_SHA256:-}"
          if [ -z "$sha" ] || [ "$UPDATE_BASELINES" != "true" ]; then
            sha="$(jq -r .sha256 "$TRIVY_DB_LOCK")"
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::$TRIVY_DB_LOCK has no valid sha256: $sha"
            exit 1
          fi
          echo "pinned Trivy database sha256: $sha"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Restore the pinned Trivy database
        id: trivydb-cache
        if: env.SHADOW != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TRIVY_DB_CACHE_PATH }}/db.tar.gz
          key: golden-trivy-db-${{ steps.trivydb.outputs.sha256 }}

      - name: Verify the pinned Trivy database
        id: trivydb-verify
        if: env.SHADOW != 'true'
        env:
          CACHE_HIT: ${{ steps.trivydb-cache.outputs.cache-hit }}
          WANT: ${{ steps.trivydb.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [ "$CACHE_HIT" != "true" ]; then
            echo "::error::No Actions cache entry golden-trivy-db-$WANT. It was evicted (unused for 7 days) or saved on another branch. The gate does not fall back to the live database. Dispatch golden-nightly on main with reseed_trivy_db=true (same database, if upstream still serves it) or refresh_trivy_db=true (new database and baselines)."
            exit 1
          fi
          got="$(sha256sum "$TRIVY_DB_CACHE_PATH/db.tar.gz" | cut -d' ' -f1)"
          if [ "$got" != "$WANT" ]; then
            echo "::error::cached database sha256 $got does not match the lock ($WANT)"
            exit 1
          fi
          # The UpdatedAt the worker must report after the scans. On a
          # refresh the lock is the old one, so the new tarball is the source.
          updated="$(tar -xzOf "$TRIVY_DB_CACHE_PATH/db.tar.gz" metadata.json | jq -r .UpdatedAt)"
          if [ "$UPDATE_BASELINES" != "true" ] || [ -z "${TRIVY_DB_REFRESH_SHA256:-}" ]; then
            locked="$(jq -r .db_updated_at "$TRIVY_DB_LOCK")"
            if [ "$updated" != "$locked" ]; then
              echo "::error::database UpdatedAt $updated does not match the lock's db_updated_at ($locked)"
              exit 1
            fi
          fi
          echo "updated_at=$updated" >> "$GITHUB_OUTPUT"

      # As the worker image's own user, so the volume keeps its ownership.
      # The worker reads /var/lib/trivy/db (TRIVY_CACHE_DIR in the dev file).
      - name: Seed the worker's Trivy cache
        if: env.SHADOW != 'true'
        run: |
          set -euo pipefail
          docker-compose run --rm --no-deps \
            -v "$TRIVY_DB_CACHE_PATH:/seed:ro" \
            --entrypoint sh celery-worker -c \
            'rm -rf /var/lib/trivy/db && mkdir -p /var/lib/trivy/db && tar -xzf /seed/db.tar.gz -C /var/lib/trivy/db && test -s /var/lib/trivy/db/trivy.db && cat /var/lib/trivy/db/metadata.json'

      # The dev image has no AUTO_MIGRATE entrypoint and the backend
      # healthcheck needs the schema, so migrate before bringing it up.
      - name: Start db + migrate
        env:
          COMPOSE_DOCKER_CLI_BUILD: "1"
          DOCKER_BUILDKIT: "1"
        run: |
          docker-compose up -d postgres redis
          docker-compose run --rm --no-deps backend alembic upgrade head

      - name: Bring up backend + worker
        env:
          COMPOSE_DOCKER_CLI_BUILD: "1"
          DOCKER_BUILDKIT: "1"
        run: |
          docker-compose up -d backend celery-worker
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health || echo 000)
            [ "$code" = "200" ] && break
            sleep 5
          done
          curl -fsS http://localhost:8000/health

      # seed_demo creates the super-admin and the team the harness scans into.
      - name: Seed the admin and team
        run: docker-compose exec -T backend python scripts/seed_demo.py

      - name: Install the test runner
        run: python -m pip install -r apps/backend/requirements-dev.txt

      - name: Golden drift gate (real cdxgen / scancode / Trivy)
        if: env.UPDATE_BASELINES != 'true' && env.SHADOW != 'true'
        env:
          GOLDEN_API: http://localhost:8000
          GOLDEN_EMAIL: admin@demo.trustedoss.dev
          GOLDEN_PASSWORD: DemoTest2026!
          GOLDEN_STRICT: "1"
        # Runs on the runner, not in the container: run_golden is stdlib-only and
        # drives the published API at localhost:8000.
        run: cd apps/backend && python -m pytest -m golden tests/e2e/golden -q -rs

      - name: Regenerate baselines (review the diff before committing)
        if: env.UPDATE_BASELINES == 'true' && env.SHADOW != 'true'
        env:
          GOLDEN_API: http://localhost:8000
          GOLDEN_EMAIL: admin@demo.trustedoss.dev
          GOLDEN_PASSWORD: DemoTest2026!
        run: |
          # GOLDEN_NAMES is one space-separated list; $GOLDEN_NAMES must split.
          # shellcheck disable=SC2086
          python apps/backend/tests/e2e/golden/run_golden.py \
            --api "$GOLDEN_API" \
            --fixtures apps/backend/tests/e2e/golden/fixtures \
            --update --names $GOLDEN_NAMES

      - name: Upload regenerated baselines
        if: env.UPDATE_BASELINES == 'true' && env.SHADOW != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: golden-baselines-${{ matrix.shard }}
          path: apps/backend/tests/e2e/golden/baselines/
          if-no-files-found: error

      # ---- Shadow run (dispatch input shadow=true) ------------------------
      # Both passes must read one Trivy database. celery-worker downloads it
      # at boot into the trivy-cache volume; the BomLens stage 2 mounts that
      # same volume read-only (SCAN_TRIVY_CACHE_VOLUME below) and never
      # updates it. The database metadata is kept before the first pass and
      # after the second, so the report shows whether it moved in between.
      - name: "Shadow: wait for the Trivy database"
        if: env.SHADOW == 'true'
        run: |
          mkdir -p golden-shadow/trivy-db
          for _ in $(seq 1 90); do
            if docker-compose exec -T celery-worker test -s /var/lib/trivy/db/metadata.json; then
              break
            fi
            sleep 10
          done
          docker-compose exec -T celery-worker cat /var/lib/trivy/db/metadata.json \
            > "golden-shadow/trivy-db/${GOLDEN_SHARD}-before.json"
          cat "golden-shadow/trivy-db/${GOLDEN_SHARD}-before.json"

      - name: "Shadow pass 1: in-process engine"
        if: env.SHADOW == 'true'
        env:
          GOLDEN_API: http://localhost:8000
          GOLDEN_EMAIL: admin@demo.trustedoss.dev
          GOLDEN_PASSWORD: DemoTest2026!
          GOLDEN_POLL_TIMEOUT: "1200"
        run: |
          # GOLDEN_NAMES is one space-separated list; $GOLDEN_NAMES must split.
          # shellcheck disable=SC2086
          python apps/backend/tests/e2e/golden/run_golden.py \
            --api "$GOLDEN_API" \
            --fixtures apps/backend/tests/e2e/golden/fixtures \
            --shadow-out golden-shadow/inprocess --names $GOLDEN_NAMES

      # SCAN_ENGINE is read by the backend when it dispatches a scan, so the
      # backend is recreated with SCAN_ENGINE=bomlens and the engine worker
      # and its socket proxy are started beside it. Postgres, Redis and
      # celery-worker (with its Trivy volume) keep running.
      - name: "Shadow: switch the stack to the BomLens engine"
        if: env.SHADOW == 'true'
        env:
          COMPOSE_FILE: docker-compose.dev.yml:apps/backend/tests/e2e/golden/compose.scancode.yml:apps/backend/tests/e2e/golden/compose.trivy-db.yml:apps/backend/tests/e2e/golden/compose.bomlens.yml
          COMPOSE_PROFILES: bomlens-engine
          GOLDEN_ENGINE_ENV_FILE: ${{ runner.temp }}/golden-engine.env
          SCAN_ENGINE: bomlens
        run: |
          # By label: compose.bomlens.yml cannot be read before the values
          # below are set.
          worker=$(docker ps -q --filter label=com.docker.compose.service=celery-worker)
          if [ "$(printf '%s\n' "$worker" | grep -c .)" != "1" ]; then
            echo "::error::expected one running celery-worker container, found: $worker"
            exit 1
          fi
          SCAN_WORKSPACE_VOLUME=$(docker inspect --format \
            '{{range .Mounts}}{{if eq .Destination "/tmp/trustedoss"}}{{.Name}}{{end}}{{end}}' "$worker")
          SCAN_TRIVY_CACHE_VOLUME=$(docker inspect --format \
            '{{range .Mounts}}{{if eq .Destination "/var/lib/trivy"}}{{.Name}}{{end}}{{end}}' "$worker")
          if [ -z "$SCAN_WORKSPACE_VOLUME" ] || [ -z "$SCAN_TRIVY_CACHE_VOLUME" ]; then
            echo "::error::celery-worker has no named workspace or Trivy volume"
            exit 1
          fi
          export SCAN_WORKSPACE_VOLUME SCAN_TRIVY_CACHE_VOLUME
          {
            echo "SCAN_WORKSPACE_VOLUME=$SCAN_WORKSPACE_VOLUME"
            echo "SCAN_TRIVY_CACHE_VOLUME=$SCAN_TRIVY_CACHE_VOLUME"
            echo "GOLDEN_ENGINE_ENV_FILE=$GOLDEN_ENGINE_ENV_FILE"
          } >> "$GITHUB_ENV"
          echo "workspace volume: $SCAN_WORKSPACE_VOLUME, Trivy volume: $SCAN_TRIVY_CACHE_VOLUME"

          # The in-process worker's environment, for worker-engine's env_file
          # (see compose.bomlens.yml). It holds the stack's secrets: written
          # under RUNNER_TEMP, never printed, never uploaded.
          (umask 077 && docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$worker" \
            > "$GOLDEN_ENGINE_ENV_FILE")
          if grep -Eq '^SCAN_BOMLENS_(DEEP_LICENSE_)?IMAGE=.' "$GOLDEN_ENGINE_ENV_FILE"; then
            echo "::error::an engine image override is set; the shadow run measures core/config.py's pins"
            exit 1
          fi

          if ! docker network inspect trustedoss-scan-egress >/dev/null 2>&1; then
            docker network create --opt com.docker.network.bridge.enable_icc=false trustedoss-scan-egress
          fi
          icc=$(docker network inspect --format \
            '{{index .Options "com.docker.network.bridge.enable_icc"}}' trustedoss-scan-egress)
          if [ "$icc" != "false" ]; then
            echo "::error::trustedoss-scan-egress allows inter-container traffic"
            exit 1
          fi

          # Pull the two engine images first so the scan times do not include
          # them: the references the runner itself uses (core/config.py).
          refs=$(docker-compose exec -T backend python -c \
            'from core.config import bomlens_image as a, bomlens_deep_license_image as b; print(a()); print(b())')
          for ref in $refs; do
            docker pull --quiet "$ref"
          done

          # docker-compose 1.29 cannot recreate a container on current Docker
          # Engine (KeyError 'ContainerConfig'), so remove the backend first
          # and let `up` create it fresh with SCAN_ENGINE=bomlens.
          docker-compose rm -fs backend
          docker-compose up -d --no-deps backend
          docker-compose up -d --no-deps docker-socket-proxy worker-engine
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health || echo 000)
            [ "$code" = "200" ] && break
            sleep 5
          done
          curl -fsS http://localhost:8000/health
          engine=$(docker-compose exec -T backend printenv SCAN_ENGINE)
          if [ "$engine" != "bomlens" ]; then
            echo "::error::the backend dispatches with SCAN_ENGINE=$engine"
            exit 1
          fi
          for _ in $(seq 1 36); do
            # Not grep -q: under pipefail its early exit fails the pipeline.
            if docker-compose logs --no-color worker-engine | grep " ready\." >/dev/null; then
              break
            fi
            sleep 5
          done
          docker-compose logs --no-color worker-engine | grep " ready\."
          df -h /

      - name: "Shadow pass 2: BomLens engine"
        if: env.SHADOW == 'true'
        env:
          GOLDEN_API: http://localhost:8000
          GOLDEN_EMAIL: admin@demo.trustedoss.dev
          GOLDEN_PASSWORD: DemoTest2026!
          GOLDEN_POLL_TIMEOUT: "1200"
        run: |
          # shellcheck disable=SC2086
          python apps/backend/tests/e2e/golden/run_golden.py \
            --api "$GOLDEN_API" \
            --fixtures apps/backend/tests/e2e/golden/fixtures \
            --shadow-out golden-shadow/bomlens --names $GOLDEN_NAMES

      - name: "Shadow: Trivy database after both passes"
        if: always() && env.SHADOW == 'true'
        run: |
          mkdir -p golden-shadow/trivy-db
          docker-compose exec -T celery-worker cat /var/lib/trivy/db/metadata.json \
            > "golden-shadow/trivy-db/${GOLDEN_SHARD}-after.json" || true
          cat "golden-shadow/trivy-db/${GOLDEN_SHARD}-after.json" || true

      - name: "Shadow: engine worker log"
        if: always() && env.SHADOW == 'true'
        run: |
          df -h / || true
          # Each engine container's start and exit, for the report's stage
          # timings (shadow_report.py --engine-log).
          mkdir -p golden-shadow/engine-log
          for c in $(docker ps -aq --filter label=com.docker.compose.service=worker-engine); do
            docker logs --tail=400 "$c" 2>&1 \
              | grep -E "bomlens|degraded|ERROR" | tail -120 || true
            docker logs "$c" 2>&1 \
              | grep -E '"event": "bomlens_container_(start|exit)"' \
              >> "golden-shadow/engine-log/${GOLDEN_SHARD}.log" || true
          done

      - name: Upload shadow captures
        if: always() && env.SHADOW == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: golden-shadow-${{ matrix.shard }}
          path: golden-shadow/
          if-no-files-found: warn

      # Fails the shard unless the worker still holds the seeded database: if
      # UpdatedAt moved, something downloaded another one and the run
      # compared baselines against advisory data nobody pinned. Runs after a
      # drift failure too, so a red run says whether the pin held.
      - name: Trivy database the scans read
        if: always() && env.SHADOW != 'true' && steps.trivydb-verify.outcome == 'success'
        env:
          PINNED_UPDATED_AT: ${{ steps.trivydb-verify.outputs.updated_at }}
        run: |
          set -euo pipefail
          docker-compose logs --no-color celery-worker | grep -E "trivy_db_(download|bootstrap)" || true
          docker-compose exec -T celery-worker cat /var/lib/trivy/db/metadata.json \
            | python apps/backend/tests/e2e/golden/check_trivy_db.py "$PINNED_UPDATED_AT"

      # scancode is best-effort in the pipeline: a failure or timeout is logged
      # as "skipped" and the scan still succeeds with declared licences only. A
      # baseline recorded that way silently loses its detected licences, so the
      # stage outcome is kept with every run, green or not.
      - name: Scan stage outcomes (worker log)
        if: always()
        run: |
          docker-compose logs --no-color celery-worker \
            | grep -E "scancode_stage|_stage_skipped|degraded" | tail -60 || true

      - name: Dump compose logs on failure
        if: failure()
        run: |
          docker-compose ps || true
          docker-compose logs --tail=300 backend celery-worker || true

      - name: "Shadow: tear down the engine services"
        if: always() && env.SHADOW == 'true'
        env:
          COMPOSE_FILE: docker-compose.dev.yml:apps/backend/tests/e2e/golden/compose.scancode.yml:apps/backend/tests/e2e/golden/compose.trivy-db.yml:apps/backend/tests/e2e/golden/compose.bomlens.yml
          COMPOSE_PROFILES: bomlens-engine
        run: |
          docker-compose down -v --remove-orphans || true
          docker network rm trustedoss-scan-egress || true

      - name: Tear down
        if: always()
        run: docker-compose down -v || true

  # Engine comparison run only (dispatch with shadow=true): the container
  # images in container_images.json, scanned with the in-process engine
  # (SCAN_CONTAINER_ENGINE=inprocess) and then with the BomLens engine
  # (SCAN_CONTAINER_ENGINE=bomlens) on one stack, both reading one Trivy
  # database. A job of its own, so the nightly and its baseline gate never
  # start it. Its captures go to the same folders as the source shards' and
  # the shadow-report job puts them in the same report.
  golden-containers:
    name: golden (containers)
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.shadow == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      # The dev stack plus the two keys container scans need (see that file).
      COMPOSE_FILE: docker-compose.dev.yml:apps/backend/tests/e2e/golden/compose.containers.yml
      TRUSTEDOSS_SCAN_BACKEND: real
      SECRET_KEY: golden-nightly-fixture-secret-key-for-workflow-runs
      RATELIMIT_DISABLED: "1"
      LOGIN_THROTTLE_ENABLED: "false"
      GOLDEN_SHARD: containers
      GOLDEN_IMAGES: apps/backend/tests/e2e/golden/container_images.json
      # Every image in GOLDEN_IMAGES is a Docker Hub official image; the
      # list admits those and nothing else. The engine path refuses an
      # address registry only when the list is empty, so with this list set
      # both engines run the same check.
      CONTAINER_SCAN_ALLOWED_REGISTRIES: docker.io/library
      SCAN_CONTAINER_ENGINE: inprocess
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Project standard (CLAUDE.md rule #10): docker-compose V1.
      - name: Install docker-compose V1
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" \
            -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Bootstrap env
        run: |
          cp .env.example .env
          mkdir -p workspace

      - name: Pre-build dev images
        uses: ./.github/actions/dev-images
        with:
          services: backend celery-worker
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start db + migrate
        env:
          COMPOSE_DOCKER_CLI_BUILD: "1"
          DOCKER_BUILDKIT: "1"
        run: |
          docker-compose up -d postgres redis
          docker-compose run --rm --no-deps backend alembic upgrade head

      - name: Bring up backend + worker
        env:
          COMPOSE_DOCKER_CLI_BUILD: "1"
          DOCKER_BUILDKIT: "1"
        run: |
          docker-compose up -d backend celery-worker
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health || echo 000)
            [ "$code" = "200" ] && break
            sleep 5
          done
          curl -fsS http://localhost:8000/health
          engine=$(docker-compose exec -T backend printenv SCAN_CONTAINER_ENGINE)
          if [ "$engine" != "inprocess" ]; then
            echo "::error::the first pass dispatches container scans with SCAN_CONTAINER_ENGINE=$engine"
            exit 1
          fi

      - name: Seed the admin and team
        run: docker-compose exec -T backend python scripts/seed_demo.py

      # Both passes read celery-worker's Trivy database, as in the source
      # shards; its metadata is kept before the first pass and after the
      # second.
      - name: "Comparison: wait for the Trivy database"
        run: |
          mkdir -p golden-shadow/trivy-db
          for _ in $(seq 1 90); do
            if docker-compose exec -T celery-worker test -s /var/lib/trivy/db/metadata.json; then
              break
            fi
            sleep 10
          done
          docker-compose exec -T celery-worker cat /var/lib/trivy/db/metadata.json \
            > "golden-shadow/trivy-db/${GOLDEN_SHARD}-before.json"
          cat "golden-shadow/trivy-db/${GOLDEN_SHARD}-before.json"

      # The images are not pulled into the runner's Docker first. celery-worker
      # has no Docker socket, so `trivy image` reads each image from its
      # registry, and the BomLens engine reads it from the registry with
      # syft; a local copy would reach neither. Both passes' scan times
      # include downloading the image.
      - name: "Comparison pass 1: in-process engine"
        env:
          GOLDEN_API: http://localhost:8000
          GOLDEN_EMAIL: admin@demo.trustedoss.dev
          GOLDEN_PASSWORD: DemoTest2026!
          GOLDEN_POLL_TIMEOUT: "1200"
        run: |
          python apps/backend/tests/e2e/golden/run_golden.py \
            --api "$GOLDEN_API" --images "$GOLDEN_IMAGES" \
            --shadow-out golden-shadow/inprocess

      # SCAN_CONTAINER_ENGINE is read by the backend when it dispatches a
      # scan: the backend is recreated with `bomlens`, and the engine worker
      # and its socket proxy start beside it, as in the source shards.
      - name: "Comparison: switch the stack to the BomLens engine"
        env:
          COMPOSE_FILE: docker-compose.dev.yml:apps/backend/tests/e2e/golden/compose.containers.yml:apps/backend/tests/e2e/golden/compose.bomlens.yml
          COMPOSE_PROFILES: bomlens-engine
          GOLDEN_ENGINE_ENV_FILE: ${{ runner.temp }}/golden-engine.env
          SCAN_CONTAINER_ENGINE: bomlens
        run: |
          worker=$(docker ps -q --filter label=com.docker.compose.service=celery-worker)
          if [ "$(printf '%s\n' "$worker" | grep -c .)" != "1" ]; then
            echo "::error::expected one running celery-worker container, found: $worker"
            exit 1
          fi
          SCAN_WORKSPACE_VOLUME=$(docker inspect --format \
            '{{range .Mounts}}{{if eq .Destination "/tmp/trustedoss"}}{{.Name}}{{end}}{{end}}' "$worker")
          SCAN_TRIVY_CACHE_VOLUME=$(docker inspect --format \
            '{{range .Mounts}}{{if eq .Destination "/var/lib/trivy"}}{{.Name}}{{end}}{{end}}' "$worker")
          if [ -z "$SCAN_WORKSPACE_VOLUME" ] || [ -z "$SCAN_TRIVY_CACHE_VOLUME" ]; then
            echo "::error::celery-worker has no named workspace or Trivy volume"
            exit 1
          fi
          export SCAN_WORKSPACE_VOLUME SCAN_TRIVY_CACHE_VOLUME
          {
            echo "SCAN_WORKSPACE_VOLUME=$SCAN_WORKSPACE_VOLUME"
            echo "SCAN_TRIVY_CACHE_VOLUME=$SCAN_TRIVY_CACHE_VOLUME"
            echo "GOLDEN_ENGINE_ENV_FILE=$GOLDEN_ENGINE_ENV_FILE"
          } >> "$GITHUB_ENV"
          echo "workspace volume: $SCAN_WORKSPACE_VOLUME, Trivy volume: $SCAN_TRIVY_CACHE_VOLUME"

          # The in-process worker's environment, allow-list included, for
          # worker-engine's env_file. It holds the stack's secrets: written
          # under RUNNER_TEMP, never printed, never uploaded.
          (umask 077 && docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$worker" \
            > "$GOLDEN_ENGINE_ENV_FILE")
          if grep -Eq '^SCAN_BOMLENS_(DEEP_LICENSE_)?IMAGE=.' "$GOLDEN_ENGINE_ENV_FILE"; then
            echo "::error::an engine image override is set; the comparison measures core/config.py's pins"
            exit 1
          fi
          if ! grep -qxF "CONTAINER_SCAN_ALLOWED_REGISTRIES=$CONTAINER_SCAN_ALLOWED_REGISTRIES" "$GOLDEN_ENGINE_ENV_FILE"; then
            echo "::error::the engine worker would not receive the registry allow-list"
            exit 1
          fi

          if ! docker network inspect trustedoss-scan-egress >/dev/null 2>&1; then
            docker network create --opt com.docker.network.bridge.enable_icc=false trustedoss-scan-egress
          fi
          icc=$(docker network inspect --format \
            '{{index .Options "com.docker.network.bridge.enable_icc"}}' trustedoss-scan-egress)
          if [ "$icc" != "false" ]; then
            echo "::error::trustedoss-scan-egress allows inter-container traffic"
            exit 1
          fi

          # An image scan runs the BomLens image only (no deep-license
          # variant). Pull it first so the scan times do not include it.
          ref=$(docker-compose exec -T backend python -c \
            'from core.config import bomlens_image; print(bomlens_image())')
          docker pull --quiet "$ref"

          # docker-compose 1.29 cannot recreate a container on current Docker
          # Engine (KeyError 'ContainerConfig'), so remove the backend first.
          docker-compose rm -fs backend
          docker-compose up -d --no-deps backend
          docker-compose up -d --no-deps docker-socket-proxy worker-engine
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health || echo 000)
            [ "$code" = "200" ] && break
            sleep 5
          done
          curl -fsS http://localhost:8000/health
          # Not printenv alone: a backend that does not know the setting
          # reads the variable and still dispatches the in-process task.
          # This fails until the backend has core.config.scan_container_engine.
          engine=$(docker-compose exec -T backend python -c \
            'from core.config import scan_container_engine; print(scan_container_engine())')
          if [ "$engine" != "bomlens" ]; then
            echo "::error::the backend dispatches container scans with engine $engine"
            exit 1
          fi
          for _ in $(seq 1 36); do
            # Not grep -q: under pipefail its early exit fails the pipeline.
            if docker-compose logs --no-color worker-engine | grep " ready\." >/dev/null; then
              break
            fi
            sleep 5
          done
          docker-compose logs --no-color worker-engine | grep " ready\."
          df -h /

      - name: "Comparison pass 2: BomLens engine"
        env:
          GOLDEN_API: http://localhost:8000
          GOLDEN_EMAIL: admin@demo.trustedoss.dev
          GOLDEN_PASSWORD: DemoTest2026!
          GOLDEN_POLL_TIMEOUT: "1200"
        run: |
          python apps/backend/tests/e2e/golden/run_golden.py \
            --api "$GOLDEN_API" --images "$GOLDEN_IMAGES" \
            --shadow-out golden-shadow/bomlens

      - name: "Comparison: Trivy database after both passes"
        if: always()
        run: |
          mkdir -p golden-shadow/trivy-db
          docker-compose exec -T celery-worker cat /var/lib/trivy/db/metadata.json \
            > "golden-shadow/trivy-db/${GOLDEN_SHARD}-after.json" || true
          cat "golden-shadow/trivy-db/${GOLDEN_SHARD}-after.json" || true

      - name: "Comparison: engine worker log"
        if: always()
        run: |
          df -h / || true
          mkdir -p golden-shadow/engine-log
          for c in $(docker ps -aq --filter label=com.docker.compose.service=worker-engine); do
            docker logs --tail=400 "$c" 2>&1 \
              | grep -E "bomlens|degraded|ERROR" | tail -120 || true
            docker logs "$c" 2>&1 \
              | grep -E '"event": "bomlens_container_(start|exit)"' \
              >> "golden-shadow/engine-log/${GOLDEN_SHARD}.log" || true
          done

      - name: Upload the comparison captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # The report job collects every golden-shadow-* artifact.
          name: golden-shadow-${{ env.GOLDEN_SHARD }}
          path: golden-shadow/
          if-no-files-found: warn

      - name: Dump compose logs on failure
        if: failure()
        run: |
          docker-compose ps || true
          docker-compose logs --tail=300 backend celery-worker || true

      - name: Tear down
        if: always()
        env:
          COMPOSE_FILE: docker-compose.dev.yml:apps/backend/tests/e2e/golden/compose.containers.yml:apps/backend/tests/e2e/golden/compose.bomlens.yml
          COMPOSE_PROFILES: bomlens-engine
        run: |
          docker-compose down -v --remove-orphans || true
          docker network rm trustedoss-scan-egress || true

  # Shadow run only: one difference table from every shard's captures.
  shadow-report:
    name: shadow-report
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.shadow == 'true' }}
    needs: [golden, golden-containers]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/backend/tests/e2e/golden

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: golden-shadow-*
          path: golden-shadow
          merge-multiple: true

      - name: Build the difference table
        run: |
          python apps/backend/tests/e2e/golden/shadow_report.py \
            --inprocess golden-shadow/inprocess \
            --bomlens golden-shadow/bomlens \
            --trivy-db golden-shadow/trivy-db \
            --engine-log golden-shadow/engine-log \
            --out golden-shadow-report/report.md
          cat golden-shadow-report/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the difference table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-shadow-report
          path: golden-shadow-report/
          if-no-files-found: warn

  nightly-alert:
    name: nightly-alert
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: golden
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/nightly-failure-issue
      - uses: ./.github/actions/nightly-failure-issue
        with:
          label: nightly-golden
          title: "Nightly golden-fixture gate is failing"
          failed: ${{ needs.golden.result == 'failure' && 'true' || 'false' }}
          details: |
            A golden shard failed. The run log names the shard and the baseline
            that drifted, with a field-level diff.

            Drift is either a product regression or an intended change. For an
            intended change, dispatch this workflow with update_baselines=true,
            download the artifact and review the diff in a PR. Never regenerate
            a baseline locally.

            Advisory data is pinned (trivy-db.lock.json), so a change in the
            vulnerability findings comes from the scan pipeline, not from a
            newly published advisory. Moving to a newer database is a
            separate dispatch with refresh_trivy_db=true. A shard that stops
            at "No Actions cache entry golden-trivy-db-..." lost its cached
            database (unused for 7 days); dispatch on main with
            reseed_trivy_db=true, or refresh_trivy_db=true if upstream no
            longer serves the locked digest.
          token: ${{ secrets.GITHUB_TOKEN }}
