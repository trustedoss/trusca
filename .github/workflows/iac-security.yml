name: IaC Security

# Static analysis of the deployment surface: the Helm chart under
# charts/trustedoss and the Dockerfiles under apps/. Complements the two
# scans that already exist — image-scan in ci.yml looks at the built
# worker image's package tree, sca-self.yml at the application
# dependency tree. Neither reads the manifests that decide how those
# images are run.
#
# Behaviour:
#   * render failure    -> HARD FAIL. See the guard step for why.
#   * 1+ CRITICAL/HIGH  -> HARD FAIL.
#   * MEDIUM and below  -> advisory. Counted in the job summary, full
#                          reports uploaded as artifacts.
#
# HIGH was advisory when this workflow landed and is not any more. The
# baseline then was 19 HIGH (15 chart, 4 Dockerfile), most of them
# pod-security defaults: KSV-0118 missing security context, KSV-0014
# writable root filesystem, DS-0002 container runs as root. Gating on them
# before they were fixed would have blocked every unrelated PR, so the
# workflow observed first and blocks now - the same progression
# dogfood-scan.yml uses. Observing forever is the failure mode that
# progression exists to avoid.
#
# How the baseline came down:
#   * DS-0002 - 4 -> 0. #62 pinned USER nginx on the production frontend,
#     which the file already intended to do. #65 made the worker image run
#     as trustedoss, which needed every bundled toolchain cache path pinned
#     under a writable home. The two development-only images are suppressed
#     with a reason in .trivyignore.iac.yaml: they bind-mount host source
#     and need a uid matching the developer running them.
#   * KSV-0118 / KSV-0014 - 15 -> 0. #63 for backend, frontend and redis;
#     #65 for worker and beat, which had to wait on the image above since
#     runAsNonRoot cannot be set for a container whose image runs as root.
#   * KSV-0109 - 1 -> 0. False positive on the key NAMES
#     ACCESS_TOKEN_EXPIRE_MINUTES / REFRESH_TOKEN_EXPIRE_DAYS, whose values
#     are lifetimes. Suppressed with the reasoning in .trivyignore.iac.yaml.
#
# Raising the bar again means changing BOTH the value below and the jq
# comparison in the gate step. See the comment there for why.

on:
  pull_request:
    paths:
      - "charts/**"
      - "apps/**/Dockerfile*"
      - ".trivyignore.iac.yaml"
      - ".github/workflows/iac-security.yml"
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "apps/**/Dockerfile*"
      - ".trivyignore.iac.yaml"
      - ".github/workflows/iac-security.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: iac-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-config:
    name: trivy config (helm chart + Dockerfiles)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      BLOCKING_SEVERITY: CRITICAL,HIGH
      ADVISORY_SEVERITY: CRITICAL,HIGH,MEDIUM,LOW
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy (pinned deb, checksum-verified — matches sca-self.yml)
        env:
          TRIVY_VERSION: "0.72.0"
          TRIVY_SHA256_AMD64: 9bf8aba92f524b74f8e83d53b298a7dfc6b4d60aca779217e7817e5433c73eeb
        run: |
          set -euo pipefail
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.deb"
          curl -fsSL -o /tmp/trivy.deb "$url"
          echo "${TRIVY_SHA256_AMD64}  /tmp/trivy.deb" | sha256sum -c -
          sudo dpkg -i /tmp/trivy.deb
          rm -f /tmp/trivy.deb
          trivy --version

      - name: Scan Helm chart
        # --helm-values is not optional. templates/secret.yaml and
        # templates/ingress.yaml call `fail` when required values are
        # unset, Trivy reports the resulting render error as a WARN and
        # still exits 0 with zero results. charts/trustedoss/ci/scan-values.yaml
        # supplies placeholders so the templates render.
        run: |
          set -euo pipefail
          trivy config \
            --skip-version-check \
            --severity "${ADVISORY_SEVERITY}" \
            --helm-values charts/trustedoss/ci/scan-values.yaml \
            --ignorefile .trivyignore.iac.yaml \
            --format json \
            --output trivy-chart.json \
            charts/trustedoss

      - name: Guard — the chart actually rendered
        # Without this, a template change that breaks rendering turns the
        # job green while inspecting nothing. A scan of zero files is a
        # failure, not a pass.
        run: |
          set -euo pipefail
          count=$(jq '[.Results[]?] | length' trivy-chart.json)
          echo "config files inspected: ${count}"
          if [ "${count}" -eq 0 ]; then
            echo "::error::Trivy inspected 0 files under charts/trustedoss. The chart failed to render — check charts/trustedoss/ci/scan-values.yaml against the required values in templates/."
            exit 1
          fi

      - name: Scan Dockerfiles
        # --ignorefile is not optional either. Trivy auto-detects the plain
        # .trivyignore but not the YAML form, and only the YAML form can scope
        # a suppression to specific paths. Without the flag the file is read as
        # nothing at all and the suppressions silently do not apply.
        run: |
          set -euo pipefail
          trivy config \
            --skip-version-check \
            --severity "${ADVISORY_SEVERITY}" \
            --ignorefile .trivyignore.iac.yaml \
            --format json \
            --output trivy-dockerfile.json \
            apps

      - name: Summarise
        run: |
          set -euo pipefail
          {
            echo "### IaC misconfiguration findings"
            echo ""
            echo "| Target | CRITICAL | HIGH | MEDIUM | LOW |"
            echo "| --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for pair in "Helm chart:trivy-chart.json" "Dockerfiles:trivy-dockerfile.json"; do
            label="${pair%%:*}"
            file="${pair##*:}"
            row="| ${label} |"
            for sev in CRITICAL HIGH MEDIUM LOW; do
              n=$(jq --arg s "$sev" '[.Results[]?.Misconfigurations[]? | select(.Severity == $s)] | length' "$file")
              row="${row} ${n} |"
            done
            echo "${row}" >> "$GITHUB_STEP_SUMMARY"
          done
          {
            echo ""
            echo "Only ${BLOCKING_SEVERITY} blocks. Full reports are in the run artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gate on ${{ env.BLOCKING_SEVERITY }}
        # BLOCKING_SEVERITY is a comma-separated list, so it is split into a
        # JSON array and matched with `index`. It used to be compared with
        # `.Severity == $s`, which only ever worked while the value was a
        # single severity: no finding has a Severity of "CRITICAL,HIGH", so
        # widening the value alone would have counted zero and quietly stopped
        # blocking anything. The value and the comparison have to move together.
        run: |
          set -euo pipefail
          sevs=$(printf '%s' "${BLOCKING_SEVERITY}" | jq -Rc 'split(",")')
          total=0
          for file in trivy-chart.json trivy-dockerfile.json; do
            n=$(jq --argjson sevs "$sevs" '[.Results[]?.Misconfigurations[]? | select(.Severity as $s | $sevs | index($s))] | length' "$file")
            echo "${file}: ${n} ${BLOCKING_SEVERITY}"
            total=$((total + n))
          done
          if [ "${total}" -gt 0 ]; then
            echo "::error::${total} ${BLOCKING_SEVERITY} misconfiguration(s). See the run artifacts for the full report."
            exit 1
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-config-reports
          path: |
            trivy-chart.json
            trivy-dockerfile.json
          if-no-files-found: warn
          retention-days: 14
