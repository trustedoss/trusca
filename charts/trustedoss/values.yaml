# Default values for the trustedoss chart.
# Every value is documented inline (chart convention). Override with
# `-f my-values.yaml` or `--set key=value`.
#
# Chart 0.3.0 (W6 / ADR-0001) — Dependency-Track has been REMOVED. Vulnerability
# matching now runs from the worker via `trivy sbom` against the locally-cached
# Trivy DB. Air-gapped sites override the upstream OCI registry with
# `env.trivy.dbRepository`. See docs/decisions/0001-replace-dt-with-trivy.md.
#
# Production-complete chart layout: bundled-or-external Postgres & Redis, a
# frontend Deployment, an Ingress (cert-manager TLS), and a Helm
# pre-install/pre-upgrade migration Job that runs `alembic upgrade head` as the
# OWNER DB role exactly once (pods run with AUTO_MIGRATE=false; the Postgres
# advisory lock in alembic/env.py is only a safety net).

# -- Override the chart name / fullname used in object names (rarely needed).
nameOverride: ""
fullnameOverride: ""

# -- Application image references. Pin to minor+patch — never `:latest`
#    (CLAUDE.md core rule #9). Published to GitHub Container Registry by
#    .github/workflows/release.yml on each vX.Y.Z tag. Override the
#    repositories for a fork / private mirror / air-gapped registry.
image:
  # API image (FastAPI). Slim, no SCA toolchain.
  backendRepository: ghcr.io/trustedoss/trusca-backend
  # Worker image (carries cdxgen / scancode / Trivy / JRE). Heavier. Also used
  # by the beat scheduler and the migration Job (alembic ships in this image).
  workerRepository: ghcr.io/trustedoss/trusca-backend-worker
  # Frontend image (React SPA on nginx, listens on :8080).
  frontendRepository: ghcr.io/trustedoss/trusca-frontend
  # Tag applied to ALL three images. Kept in lock-step with Chart.yaml appVersion.
  tag: "0.21.0"
  pullPolicy: IfNotPresent
# -- Image pull secrets for private registries (list of {name: ...}).
imagePullSecrets: []

# -- Per-workload ServiceAccounts (least privilege). One account per workload;
#    no cluster-wide RBAC is requested (the app talks to Postgres / Redis / DT,
#    not the Kubernetes API).
serviceAccount:
  create: true
  annotations: {}

# ===========================================================================
# Application environment.
#
# Non-secret keys map 1:1 to the os.getenv() accessors in
# apps/backend/core/config.py and to the docker-compose `${VAR:-default}`
# defaults. Secret keys (DB DSNs, SECRET_KEY) live in a Secret — see
# `env.secret` and the bundled-datastore blocks below.
# ===========================================================================
env:
  # APP_ENV: dev | staging | prod. Drives CORS/log strictness in the backend.
  appEnv: prod
  # LOG_LEVEL: DEBUG | INFO | WARNING | ERROR.
  logLevel: INFO
  # CORS allow-list (comma-separated). Production MUST enumerate origins
  # (CLAUDE.md core rule #13) — no wildcard. Typically your ingress host(s),
  # e.g. "https://trustedoss.example.com".
  corsAllowedOrigins: ""

  # JWT lifetimes (security defaults — CLAUDE.md §3).
  accessTokenExpireMinutes: 30
  refreshTokenExpireDays: 7

  # ---- Anything the chart does not spell out ------------------------------
  #
  # Every other key in this file is named explicitly, which says clearly what
  # the chart supports and leaves it behind the portal at each release. The
  # portal gained OAuth sign-in, SMTP / Slack / Teams notifications, the
  # vendored-code identification service and the Jira link since chart 0.12.0,
  # and a Helm install could not set any of them. These two keys close that
  # gap for the ones already shipped and the ones not written yet.
  #
  # `extraEnv` is a plain map, injected into backend, worker and beat. It is
  # for non-secret settings; the reference for what exists is
  # `docs-site/docs/reference/env-variables.md`:
  #
  #   extraEnv:
  #     SCANOSS_ENABLED: "true"
  #     KEV_REFRESH_ENABLED: "false"     # air-gapped
  #     DISK_HARD_LIMIT_PCT: "98"
  #     WEBHOOK_RATE_LIMIT: "240/minute"
  #
  extraEnv: {}

  # `extraEnvFrom` is a raw envFrom list, so it takes Secrets you created
  # yourself. Credentials belong here rather than in `extraEnv`: a value in
  # `extraEnv` lives in this file, and an SMTP password or an OAuth client
  # secret should not be committed:
  #
  #   extraEnvFrom:
  #     - secretRef:
  #         name: trustedoss-notifications   # SMTP_*, SLACK_WEBHOOK_URL, ...
  #     - secretRef:
  #         name: trustedoss-oauth           # GITHUB_CLIENT_ID / _SECRET, ...
  #
  extraEnvFrom: []

  # -------------------------------------------------------------------------
  # External datastore DSNs. Used ONLY when postgres.bundled / redis.bundled
  # are false. Leave blank when bundling. asyncpg driver for Postgres.
  # -------------------------------------------------------------------------
  database:
    # Runtime DML-only DSN (DATABASE_URL_APP). For a single-role external DB,
    # set this to your one DSN and leave ownerUrl empty (the chart falls back
    # to this for migrations too).
    url: ""
    # Owner/DDL DSN (DATABASE_URL_OWNER) — used by the migration Job to run
    # `alembic upgrade head`. Set when your external DB uses role separation
    # (a dedicated owner role for DDL, a DML-only role for runtime). When
    # empty, the migration Job falls back to `database.url`.
    ownerUrl: ""
  redis:
    # REDIS_URL — broker + result backend. External Redis/Memorystore.
    url: ""

  # -------------------------------------------------------------------------
  # Application secret material. The chart renders a Secret (secret.yaml)
  # holding DATABASE_URL_APP / DATABASE_URL_OWNER / REDIS_URL / SECRET_KEY,
  # UNLESS you supply an existingSecret — then ALL four keys must exist in it:
  #   DATABASE_URL_APP, DATABASE_URL_OWNER, REDIS_URL, SECRET_KEY
  # -------------------------------------------------------------------------
  secret:
    # Pre-created Secret to use instead of the chart-rendered one. When set,
    # the chart renders NO Secret and references these keys verbatim.
    existingSecret: ""
    # SECRET_KEY (JWT signing, >= 32 chars). Inline value goes INTO the
    # chart-rendered Secret. Generate with `openssl rand -hex 32`.
    # REQUIRED unless existingSecret is set. Never commit a real value.
    secretKey: ""

  # -------------------------------------------------------------------------
  # Trivy DB — vulnerability data path (v2.4.0+, ADR-0001).
  #
  # Vulnerability matching runs from the worker via `trivy sbom` against the
  # locally-cached Trivy DB. There is NO external vulnerability engine to wire
  # in — the data ships through Trivy's OCI registry.
  #
  # AIR-GAPPED: set `dbRepository` to an internal OCI mirror you maintain
  # (mirror with e.g. `oras cp ghcr.io/aquasecurity/trivy-db:2 …`). The worker
  # downloads + caches the DB on first boot; the weekly refresh beat keeps it
  # fresh against `dbRepository`.
  # -------------------------------------------------------------------------
  trivy:
    # TRIVY_DB_REPOSITORY — OCI registry the worker pulls the DB from.
    # Override for an air-gapped mirror; default is the upstream registry.
    dbRepository: "ghcr.io/aquasecurity/trivy-db"
    # TRIVY_DB_REFRESH_HOURS — beat cadence for the DB refresh task. Trivy's
    # upstream DB rebuilds roughly daily; weekly (168h) is the documented
    # sweet spot between freshness + bandwidth.
    dbRefreshHours: 168
    # TRIVY_CACHE_DIR — in-container path the cached DB lands at. Backed by
    # the dedicated trivy-cache PVC (see `trivyCache.persistence`), mounted
    # rw on the worker (bootstrap + weekly refresh) and ro on the backend
    # (admin health / disk telemetry).
    dbCacheDir: "/var/lib/trivy"
    # TRIVY_TIMEOUT_SECONDS — per-invocation wall clock for `trivy sbom`.
    timeoutSeconds: 300

  # -------------------------------------------------------------------------
  # DB connection pool (B1). Total connections per process = size + overflow,
  # multiplied by backend.replicaCount x backend.uvicornWorkers for the
  # backend tier. W2 (concurrency-scaling-plan-2026-08-22.md §1.6) lowered
  # these from 20/10/5/5; the OLD defaults put the backend tier alone at
  # 2 x 4 x 30 = 240 connections against Postgres' default 100. Mind the
  # budget (see NOTES.txt, which renders from the same formula as
  # apps/backend/core/connection_budget.py). The backend clamps each value.
  # -------------------------------------------------------------------------
  dbPool:
    size: 5             # DB_POOL_SIZE
    maxOverflow: 3      # DB_MAX_OVERFLOW
    timeout: 30         # DB_POOL_TIMEOUT
    recycle: 1800       # DB_POOL_RECYCLE
    syncSize: 3         # DB_SYNC_POOL_SIZE (per worker AND per beat pod)
    syncMaxOverflow: 3  # DB_SYNC_MAX_OVERFLOW
    syncTimeout: 30     # DB_SYNC_POOL_TIMEOUT
    syncRecycle: 1800   # DB_SYNC_POOL_RECYCLE

  # -------------------------------------------------------------------------
  # Scan controls (B1 abuse limits + A1 stability).
  # -------------------------------------------------------------------------
  scan:
    triggerRateLimit: "20/minute"      # SCAN_TRIGGER_RATE_LIMIT
    concurrencyCapPerTeam: 10          # SCAN_CONCURRENCY_CAP_PER_TEAM (0=off)
    softTimeLimitSeconds: 3600         # SCAN_SOFT_TIME_LIMIT_SECONDS
    hardTimeLimitSeconds: 3900         # SCAN_HARD_TIME_LIMIT_SECONDS
    workspaceOrphanMaxAgeSeconds: 900  # WORKSPACE_ORPHAN_MAX_AGE_SECONDS

  # -------------------------------------------------------------------------
  # scancode first-party license detection guards (A2).
  # -------------------------------------------------------------------------
  scancode:
    timeoutSeconds: 600          # SCANCODE_TIMEOUT_SECONDS
    maxFiles: 20000              # SCANCODE_MAX_FILES
    maxDetections: 5000          # SCANCODE_MAX_DETECTIONS
    # Quoted to keep it a plain-integer string (int64 guard in the template).
    maxResultBytes: "268435456"  # SCANCODE_MAX_RESULT_BYTES (256 MiB)

# ===========================================================================
# Shared workspace volume.
#
# Source-scan tasks write `${WORKSPACE_HOST_PATH}/<scan_id>/` and the backend
# reads it back for archive download / backup. backend + worker BOTH mount it,
# so on multi-node clusters it MUST be ReadWriteMany. The chart provisions one
# PVC and mounts it at /workspace.
# ===========================================================================
workspace:
  # Mount path inside backend + worker (WORKSPACE_HOST_PATH).
  mountPath: /workspace
  persistence:
    enabled: true
    # ReadWriteMany is required when backend and worker land on different
    # nodes (the default). Use ReadWriteOnce ONLY if you pin both to one node.
    accessMode: ReadWriteMany
    size: 20Gi
    # storageClassName: "" leaves it to the cluster default. Set a RWX class
    # (e.g. nfs / efs / filestore / longhorn) on multi-node clusters.
    storageClassName: ""
    # Use a pre-created PVC instead of provisioning one.
    existingClaim: ""

# ===========================================================================
# Trivy DB cache volume (H-6 / L-2).
#
# The worker downloads the ~500 MiB vulnerability DB on boot and refreshes it
# weekly (beat task); the backend reads `metadata.json` from the same cache
# for the admin health panel and the admin/disk `trivy_db` card. worker (rw)
# + backend (ro) BOTH mount it at env.trivy.dbCacheDir, so on multi-node
# clusters it MUST be ReadWriteMany — without persistence every worker
# restart re-downloads the DB and the backend reports "unknown".
# ===========================================================================
trivyCache:
  persistence:
    enabled: true
    # ReadWriteMany is required when backend and worker land on different
    # nodes (the default). Use ReadWriteOnce ONLY if you pin both to one node.
    accessMode: ReadWriteMany
    size: 2Gi
    # storageClassName: "" leaves it to the cluster default. Set a RWX class
    # (e.g. nfs / efs / filestore / longhorn) on multi-node clusters.
    storageClassName: ""
    # Use a pre-created PVC instead of provisioning one.
    existingClaim: ""

# ===========================================================================
# Bundled PostgreSQL (StatefulSet + headless Service + PVC).
#
# bundled=true  → the chart runs Postgres in-cluster and wires the runtime /
#                 owner DSNs automatically into the Secret. Good for on-prem /
#                 evaluation. NOT recommended for managed-cloud production —
#                 prefer Cloud SQL / RDS (set bundled=false + env.database.*).
# bundled=false → no Postgres objects are rendered; env.database.url /
#                 env.database.ownerUrl are used.
# ===========================================================================
postgres:
  bundled: true
  image:
    repository: postgres
    tag: "17.2-alpine"   # CLAUDE.md #9 — pinned, never :latest
    pullPolicy: IfNotPresent
  auth:
    # Owner (DDL) role — runs migrations; also runtime role when
    # roleSeparation=false.
    username: trustedoss
    password: ""          # REQUIRED when bundled. openssl rand -hex 24
    database: trustedoss
    # L1 role separation (Marathon bundle 8): a DML-only app role for the
    # runtime, owner role reserved for migrations. When false, one role does
    # both (simpler; matches the default docker-compose dev posture).
    roleSeparation: false
    appUsername: trustedoss_app
    appPassword: ""       # REQUIRED when roleSeparation=true
  service:
    port: 5432
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: ""
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi

# ===========================================================================
# Bundled Redis (Deployment + Service). Broker + result backend.
# bundled=false → no Redis objects; env.redis.url is used.
# Redis is a cache/broker here (Celery), so it is intentionally ephemeral
# (no PVC by default — task state is reconstructable).
# ===========================================================================
redis:
  bundled: true
  image:
    repository: redis
    tag: "7.4-alpine"     # CLAUDE.md #9 — pinned, never :latest
    pullPolicy: IfNotPresent
  service:
    port: 6379
  persistence:
    # Off by default — broker queue is transient. Enable for at-least-once
    # delivery across Redis restarts (appendonly is always on).
    enabled: false
    size: 1Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # uid/gid 999 is the `redis` user the official image runs as. fsGroup was
  # already set here for the data volume; the rest states what the container
  # is doing anyway. See backend.podSecurityContext for the override note.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  # redis writes the append-only file to /data, a volume, and nothing to the
  # root filesystem. Verified against redis:7.4-alpine with --read-only:
  # PING, SET and BGSAVE all succeed.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# ===========================================================================
# Database migration Job (Helm pre-install + pre-upgrade hook).
#
# Runs `alembic upgrade head` ONCE as the OWNER role before pods roll. Pods run
# with AUTO_MIGRATE=false, so the Job is the sole migrator (the advisory lock in
# alembic/env.py remains a safety net). Forward-only (CLAUDE.md migration
# policy) — the Job never downgrades.
# ===========================================================================
migrationJob:
  enabled: true
  # Retries on transient failure (e.g. DB still warming up). Each attempt runs
  # alembic upgrade head — idempotent, so retries are safe.
  backoffLimit: 3
  # Hard ceiling so a wedged migration cannot block a release indefinitely.
  activeDeadlineSeconds: 1800
  # TTL after the Job finishes (k8s GCs it). hook-delete-policy also cleans up.
  ttlSecondsAfterFinished: 600
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

# ===========================================================================
# Backend (FastAPI) workload.
# ===========================================================================
backend:
  replicaCount: 2
  # W1 (concurrency-scaling-plan-2026-08-22.md §1.6/§3.5): the number of
  # uvicorn worker PROCESSES each backend pod runs. deployment-backend.yaml
  # injects this as the UVICORN_WORKERS env var, which
  # apps/backend/Dockerfile.prod's CMD reads at container start (a real
  # knob, not just a documented default); see the `env:` comment there.
  # Also what the connection-budget formula (NOTES.txt, values below) and
  # the boot-time over-budget warning multiply DB_POOL_SIZE + DB_MAX_OVERFLOW
  # by. Default 4 matches the image's own default when this is unset
  # entirely (e.g. a bare `docker run`).
  uvicornWorkers: 4
  port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi
  # Liveness — PURE liveness (/health); touches no DB, proves only uvicorn is up.
  healthPath: /health
  # Readiness — /health/ready returns 200 only when the schema == Alembic HEAD
  # (B1). Pods join the Service only after the migration Job has landed.
  readyPath: /health/ready
  # Pod security. uid/gid 1000 is the `trustedoss` user the image creates
  # (apps/backend/Dockerfile.prod:65) and already runs as, so this pins what
  # the image does rather than changing it. fsGroup makes the workspace
  # volume group-writable for that user.
  #
  # Override both maps if you build the image with a different uid. To drop a
  # block entirely, set it to `null`, not `{}` — Helm deep-merges maps, so an
  # empty map leaves every default in place and the block renders unchanged.
  # A dropped block puts the pod back on cluster defaults, which is what Trivy
  # KSV-0118 flags.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  # readOnlyRootFilesystem needs a writable /tmp, mounted as an emptyDir by
  # the Deployment, and XDG_CACHE_HOME pointed into it — the Deployment sets
  # that too. HOME is /app in this image, so with the root filesystem sealed
  # fontconfig has nowhere to cache: WeasyPrint still produces a correct PDF
  # but prints "No writable cache directories" on every font lookup and
  # rebuilds the cache each time. Verified against the built image with
  # --read-only: startup, /health, /health/ready and a WeasyPrint render all
  # succeed, and the fontconfig errors disappear once XDG_CACHE_HOME is set.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # W8 (concurrency-scaling-plan-2026-08-22.md §3.5): this is an availability
  # fix for an already-standing gap, not a feature flag, so it applies
  # unconditionally rather than behind an `enabled` toggle (unlike
  # worker.autoscaling below, which stays opt-in). maxUnavailable: 1 fits
  # every replicaCount, including 1 -- Kubernetes' own PDB math computes
  # desiredHealthy = replicaCount - maxUnavailable, and a voluntary eviction
  # is allowed whenever currentHealthy > desiredHealthy. At replicaCount=1
  # that is 1 > 0 (eviction proceeds; a single-replica install is never
  # stuck), and at replicaCount=2 it is 2 > 1 (one pod may go down, the
  # second is protected until the first is Ready again) -- see the
  # pdb-backend.yaml template and its render-golden test for both cases.
  podDisruptionBudget:
    maxUnavailable: 1
  # Spreads backend pods across nodes/zones so draining ONE node cannot take
  # multiple replicas down at once (the gap PDB alone does not close: PDB
  # only bounds voluntary disruption count, it says nothing about where pods
  # already landed). `whenUnsatisfiable: ScheduleAnyway` (soft) on purpose --
  # `DoNotSchedule` (hard) would leave a pod Pending forever on a single-node
  # cluster (kind, a one-VM install) where the constraint cannot be
  # satisfied, which is a worse regression than no spreading at all. Set to
  # `[]` to drop spreading entirely; each entry is applied with a
  # labelSelector matching this Deployment's own pods (deployment-backend.yaml
  # fills that in; it is not a raw passthrough of the Kubernetes API shape).
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway

# ===========================================================================
# Celery workers - split into two dedicated workloads (S3,
# concurrency-scaling-plan-2026-08-22.md §3.2/§4/§5, "S3에 대한 판단" /
# "큐 분리는 롤링 업그레이드 중에...").
#
# worker.scan runs the scan pipeline (scan_source, scan_container,
# ingest_sbom, scan_reachability) - the only tasks that can occupy a slot for
# up to the scan hard time limit (default 3900s). worker.default runs
# everything else (notifications, backups, audit export, ticket webhooks,
# catalog-refresh beats, retention sweeps, the scan-schedule poll) - short,
# frequent tasks that must never queue behind an hour-long scan. Before this
# split both ran on one queue/worker pair (`worker.replicaCount` /
# `worker.concurrency`, task_default_queue="trustedoss.default"); this is why
# a rolling upgrade needs the transition handling below.
#
# worker.queues names the two Celery queues. `default` is deliberately the
# SAME string this chart used as its single queue before the split
# (tasks/celery_app.py's task_default_queue) - a message already sitting
# there when a rolling upgrade lands this chart is a worker.queues.default
# message either way, so any worker still subscribed to it drains it, no
# rename step. Cross-checked against tests/contracts/queue-names.json, the
# vocabulary this value and the backend's task_routes both derive from (see
# that file's $comment for the full cross-check).
#
# worker.transitionSubscribeBothQueues (default true): for one release after
# the split ships, BOTH worker kinds subscribe to BOTH queues (`-Q
# <scan>,<default>`, not just their own queue). The rolling upgrade takes the
# OLD single-queue worker out of rotation while the two NEW workers come up;
# anything the old worker had not yet picked up is sitting in
# worker.queues.default (the unchanged name), and that queue could still
# hold scan-pipeline messages dispatched before the upgrade. Narrow this to
# `false` only once an operator has confirmed the old queue has drained -
# see charts/trustedoss/README.md "Queue split transition" for the exact
# procedure and what to check first. Narrowing is a values change only, no
# template edit.
#
# Horizontal scaling (B2, still true post-split): prefer raising a worker
# kind's `replicaCount` (more pods) over its `concurrency` (more prefork
# slots per pod) - each SCAN slot can fork a full cdxgen/scancode/Trivy
# pipeline (~1.5-2 GB transient); default-queue tasks are much lighter.
# Postgres draw = (scan.replicaCount + default.replicaCount) x
# (dbPool.syncSize + syncMaxOverflow) - NOTES.txt's connection budget sums
# both worker kinds into the one CONN_BUDGET_WORKER_REPLICAS hint W2 already
# reads, so the formula there did not need to change shape, only its input.
# ===========================================================================
worker:
  queues:
    scan: "trustedoss.scan"
    default: "trustedoss.default"
  transitionSubscribeBothQueues: true

  # -------------------------------------------------------------------------
  # Scan-pipeline worker. Same sizing the pre-split single worker used - S1 /
  # S4 / S5 already tuned these numbers for the heaviest tasks in the fleet,
  # and splitting the queue does not change how expensive a scan slot is.
  # -------------------------------------------------------------------------
  scan:
    replicaCount: 2
    concurrency: 2
    # S4 (concurrency-scaling-plan-2026-08-22.md §3.2/§4): how long Kubernetes
    # waits, after sending SIGTERM, before it SIGKILLs a terminating worker
    # pod. Unchanged from the pre-split default: the scan pipeline's hard
    # time limit (SCAN_HARD_TIME_LIMIT_SECONDS,
    # core/config.py::scan_hard_time_limit_seconds(), default 3900s / 65 min)
    # PLUS the same 300s safety margin (BROKER_VISIBILITY_TIMEOUT_MARGIN_SECONDS).
    # Helm cannot read that Python accessor at render time, so this default
    # (4200s / 70 min) is a STATIC mirror, not a derivation -- raising
    # SCAN_HARD_TIME_LIMIT_SECONDS in the backend's env must be paired with
    # raising this value too, or a scan worker scaled down mid-scan can still
    # be SIGKILLed before the hard-limit handler marks the scan failed cleanly.
    terminationGracePeriodSeconds: 4200
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 6Gi
    # Optional autoscaler - OFF by default (chart convention). Only the scan
    # worker offers mode: queue (KEDA) -- see the comment below for why the
    # default worker does not need it.
    autoscaling:
      enabled: false
      # S5 (concurrency-scaling-plan-2026-08-22.md §3.2/§4): "cpu" is this
      # chart's original, only-ever-existed behavior -- a HorizontalPodAutoscaler
      # (hpa-worker-scan.yaml) scaling on CPU utilization. "queue" replaces it
      # with a KEDA ScaledObject (scaledobject-worker-scan.yaml) that scales
      # on the scan queue's length instead. CPU utilization does not track
      # slot occupancy for this workload: cdxgen/Trivy pipelines are network-
      # and disk-wait heavy, not CPU-heavy (plan §1.1, "cdxgen과 Trivy는
      # 네트워크와 디스크 대기가 긴 작업이라 CPU 사용률이 슬롯 점유를 대표하지
      # 않는다"), so a CPU-only autoscaler can read as idle while the queue
      # backs up. This mode choice is SCAN-ONLY (S3 judgment call, see
      # worker.default.autoscaling below): the default worker's tasks are
      # short and their CPU draw tracks their actual load reasonably well, so
      # a second KEDA ScaledObject there would add CRD-dependency surface
      # without a measured benefit yet.
      #
      # "queue" REQUIRES KEDA (https://keda.sh -- CNCF, Apache-2.0) and its
      # CRDs (ScaledObject, TriggerAuthentication under keda.sh/v1alpha1)
      # already installed in the cluster. This chart does NOT install KEDA and
      # cannot check whether it is present -- `helm template`/`helm lint` never
      # validate that a CRD exists (no cluster access), so `mode: queue` on a
      # cluster without KEDA will pass `helm template` cleanly but fail at
      # `helm install`/`upgrade` apply time with "no matches for kind
      # ScaledObject in version keda.sh/v1alpha1". Install KEDA FIRST. See
      # charts/trustedoss/README.md "Queue-depth autoscaling (KEDA)".
      #
      # Leaving this at "cpu" (the default) renders byte-for-byte the same
      # HPA this chart has always rendered when autoscaling.enabled=true --
      # scaledobject-worker-scan.yaml only renders when mode is exactly
      # "queue", and hpa-worker-scan.yaml only renders when mode is exactly
      # "cpu", so the two are mutually exclusive by construction (two
      # autoscalers targeting the same scaleTargetRef would fight each other
      # over the replica count -- KEDA creates its own HPA under the hood
      # from the ScaledObject, so pairing it with hpa-worker-scan.yaml would
      # mean TWO HPAs on one Deployment).
      mode: cpu  # cpu | queue
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 75
      # Read only when mode: queue.
      queue:
        # The Celery broker list this reads with `LLEN` (same key M2's
        # `trusca_broker_queue_backlog` metric reads, services/metrics_service.py
        # `_broker_queue_backlog()` -- this does NOT require that metric or its
        # QUEUE_BACKLOG_METRICS_ENABLED flag to be on; KEDA's native Redis
        # scaler reads the broker directly, no dependency on the app's
        # /metrics endpoint). Pinned to worker.queues.scan, not the combined
        # depth: even while transitionSubscribeBothQueues is true and this
        # worker is also draining worker.queues.default, the backlog that
        # actually signals "this workload needs more scan slots" is the scan
        # queue's own length.
        queueName: "trustedoss.scan"
        # KEDA's `listLength` metadata -- target average queue length per
        # replica. KEDA scales replicas toward ceil(currentLength / listLength).
        # Same role as targetCPUUtilizationPercentage above, but for backlog
        # instead of CPU. Keep this in the single digits: this workload's
        # slots are expensive (each can fork a full cdxgen/scancode/Trivy
        # pipeline, ~1.5-2 GB transient -- see worker.scan.resources above),
        # unlike a typical KEDA target sized for a cheap HTTP handler.
        listLength: "5"
        # Below this list length KEDA will scale to 0 replicas -- but only if
        # minReplicas above is ALSO 0 (a ScaledObject never scales below its
        # own minReplicaCount). At this chart's default minReplicas: 2 this
        # has no effect; documented for operators who lower minReplicas to 0
        # for a scale-to-zero worker pool.
        activationListLength: "0"
        # Seconds between KEDA's polls of the Redis list length.
        pollingInterval: 15
        # Seconds KEDA waits, after the queue metric drops below the scaling
        # threshold, before it actually removes a replica. S4
        # (worker.scan.terminationGracePeriodSeconds above) already makes a
        # scale-down SAFE for a replica running an in-flight scan -- Kubernetes
        # gives that pod 4200s to finish before SIGKILL. This is a separate,
        # complementary knob that makes KEDA LESS EAGER to scale down in the
        # first place, so a queue that briefly drains and refills does not
        # thrash replicas up and down. Defaults to the same 4200s so the two
        # numbers do not drift apart without a reason to.
        cooldownPeriod: 4200
        # Connection details for the Redis LLEN read above. KEDA's `redis`
        # scaler wants host:port, not a full connection-string DSN, so this
        # chart does not try to parse env.redis.url / the bundled-Redis URL
        # helper (trustedoss.redis.url) to derive one -- besides the format
        # mismatch, env.secret.existingSecret can make REDIS_URL entirely
        # opaque to Helm at render time (the chart never sees its value), so
        # there would be nothing to parse in that case anyway. See README.md
        # "Queue-depth autoscaling (KEDA)" for the full explanation.
        redis:
          # host:port. Empty (the default) means "derive from the bundled
          # Redis Service" -- which only resolves to something reachable when
          # redis.bundled: true. Required (the chart fails the render with a
          # clear message otherwise) when mode: queue and redis.bundled: false.
          address: ""
          databaseIndex: 0
          enableTLS: false
          # Name of a pre-existing Secret holding the Redis password, and the
          # key inside it holding the value. Leave passwordSecretName empty
          # for no auth -- this chart's bundled Redis (deployment-redis.yaml)
          # runs with no --requirepass, so that is this chart's own default
          # too. Override both when pointing mode: queue at an external Redis
          # / Memorystore that requires auth.
          passwordSecretName: ""
          passwordSecretKey: password

  # -------------------------------------------------------------------------
  # Default-queue worker. Notifications, backups, audit export, ticket
  # webhooks, catalog-refresh beats, workspace/tarball retention sweeps, the
  # scan-schedule poll -- everything that is not the scan pipeline itself.
  # A lighter resource profile than the scan worker (S3 judgment call): none
  # of these tasks fork a cdxgen/scancode/Trivy pipeline, so the ~1.5-2 GB
  # per-slot transient the scan worker is sized for does not apply here. A
  # higher default concurrency is safe for the same reason -- more short,
  # low-memory tasks fit per pod than scan slots do.
  # -------------------------------------------------------------------------
  default:
    replicaCount: 1
    concurrency: 4
    # S3 judgment call: this worker never runs a scan task, so tying its
    # grace period to the scan pipeline's 4200s (worker.scan above) would
    # just make a stuck default-queue pod take 70 minutes to recycle for no
    # reason. The longest task this worker DOES run is trustedoss.backup.run,
    # bounded by BACKUP_SUBPROCESS_TIMEOUT (apps/backend/tasks/backup.py,
    # default 3600s for EACH of the pg_dump and workspace-tar subprocesses it
    # shells out to, so up to ~2x that back-to-back in the worst case -- this
    # default is deliberately sized off one 3600s window plus the same 300s
    # margin S4 uses elsewhere, not two, since the two subprocesses are the
    # rare worst case, not the common one, and an operator running much
    # larger backups should raise both BACKUP_SUBPROCESS_TIMEOUT and this
    # value together). Helm cannot read that env accessor at render time --
    # same static-mirror caveat as worker.scan.terminationGracePeriodSeconds.
    terminationGracePeriodSeconds: 3900
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    # CPU-based only -- see worker.scan.autoscaling.mode's comment above for
    # why queue-depth (KEDA) scaling is scoped to the scan worker only.
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 75

  # uid/gid 1000 is the `trustedoss` user the worker image creates and runs as
  # (apps/backend/Dockerfile.worker). fsGroup makes the workspace and Trivy
  # cache volumes group-writable for it. Shared by both worker kinds -- they
  # run the same image and need the same pod security posture; only their
  # replica/resource/scaling profile above differs. See backend.podSecurityContext
  # for what overriding these maps means.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  # readOnlyRootFilesystem needs two emptyDir mounts, added by each
  # Deployment: /home/trustedoss for the toolchain caches (gradle, mvn, npm,
  # dotnet, go - the image pins every one of them under that directory so a
  # single mount covers them) and /tmp for scratch. Both are per-pod, so
  # caches are rebuilt after a restart; switch the home volume to a PVC if
  # repeated Java or .NET scans make the re-download cost matter. Shared by
  # both worker kinds for the same reason podSecurityContext is: same image,
  # same filesystem layout, only the scan worker actually populates most of
  # these caches (cdxgen only runs there), which is harmless idle space on
  # the default worker.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# ===========================================================================
# Celery beat (singleton scheduler). Exactly one replica.
# ===========================================================================
beat:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # Same image as the worker, so the same uid. See worker.podSecurityContext.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  # beat writes its schedule database to /tmp (the --schedule flag in the
  # Deployment), so sealing the root filesystem without that mount stops it
  # from starting at all.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# ===========================================================================
# Frontend (React SPA on nginx, :8080).
# ===========================================================================
frontend:
  replicaCount: 2
  port: 8080
  # nginx serves /healthz with a literal 200 — used by both probes.
  healthPath: /healthz
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # uid/gid 101 is the `nginx` user the base image provisions and the image
  # runs as (apps/frontend/Dockerfile.prod). Port 8080 is above 1024 so the
  # unprivileged process can bind it. See backend.podSecurityContext for what
  # overriding these maps means.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  # nginx.conf already puts the pid file and every *_temp_path under /tmp,
  # which the Deployment mounts as an emptyDir. Logs go to /dev/stdout and
  # /dev/stderr, and no proxy cache is configured, so nothing else on the
  # root filesystem is written.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# ===========================================================================
# Ingress (cert-manager TLS).
#
# Routes:
#   /v1, /auth, /ws, /health, /metrics  → backend Service  (API)
#   /                                   → frontend Service (SPA, catch-all)
# Backend paths are listed first so they win over the SPA catch-all (most
# ingress controllers match by path specificity / order).
# ===========================================================================
ingress:
  enabled: true
  className: nginx
  # The host the portal is served on. REQUIRED when ingress.enabled.
  host: ""
  annotations:
    # cert-manager issues + renews the TLS cert. Point at your ClusterIssuer.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # SPA + WebSocket friendliness on the nginx ingress controller.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  tls:
    enabled: true
    # Secret cert-manager writes the issued cert into. Defaults to
    # "<fullname>-tls" when left empty.
    secretName: ""

# Pod scheduling extras applied to all workloads.
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
