{{- /*
Credentials the engine's Jobs read (a proxy address with a login), rendered only
from worker.engine.credentials.data. With existingSecret nothing is created.
Each key is named after the variable it fills.
*/ -}}
{{- if and .Values.worker.engine.enabled .Values.worker.engine.credentials.data (not .Values.worker.engine.credentials.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trustedoss.engine.credentialsSecret" . }}
  labels:
    {{- include "trustedoss.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-engine
type: Opaque
stringData:
  {{- range $key, $value := .Values.worker.engine.credentials.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
