{{- /*
Config preflight Job, a Helm pre-install + pre-upgrade hook.

Runs `python -m scripts.check_config` (apps/backend/scripts/check_config.py)
against the SAME env the backend Deployment would get (envFrom the shared
`-env` ConfigMap + `runtimeSecretEnv`), before job-migrate.yaml and the
workload Deployments roll. Every core/config.py accessor is evaluated once
here; a bad value (a template SECRET_KEY, a malformed rate-limit string, an
out-of-range number) fails the release BEFORE alembic runs or a pod starts,
instead of on whichever request first exercises that one accessor lazily at
runtime: the exact failure mode main.py's lifespan comment for
SECRET_KEY/API_KEY_HMAC_SECRET describes, generalised to the other ~260
accessors those two ad-hoc checks did not cover.

Hook semantics:
  - hook: pre-install,pre-upgrade  → runs before workloads on install AND upgrade.
  - hook-weight: "-6"              → one step before job-migrate.yaml ("-5"), so
                                     a bad config fails before alembic even
                                     connects, not after.
  - hook-delete-policy: before-hook-creation,hook-succeeded
                                   → the previous run is cleaned up before a new
                                     one is created, and a successful run is GC'd.

The image is the backend image (not worker) because `core.config` and its
dependencies ship there and this needs nothing else. No DB/Redis connection
is made, so there is no initContainer wait for Postgres here, unlike
job-migrate.yaml.
*/ -}}
{{- if .Values.configCheckJob.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "trustedoss.fullname" . }}-check-config
  labels:
    {{- include "trustedoss.labels" . | nindent 4 }}
    app.kubernetes.io/component: check-config
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.configCheckJob.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.configCheckJob.activeDeadlineSeconds }}
  {{- if .Values.configCheckJob.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ .Values.configCheckJob.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "trustedoss.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: check-config
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "trustedoss.serviceAccountName" (dict "root" $ "component" "check-config") }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: check-config
          image: "{{ .Values.image.backendRepository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "scripts.check_config"]
          envFrom:
            - configMapRef:
                name: {{ include "trustedoss.fullname" . }}-env
            {{- include "trustedoss.extraEnvFrom" . | nindent 12 }}
          env:
            {{- include "trustedoss.runtimeSecretEnv" . | nindent 12 }}
            {{- include "trustedoss.extraEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.configCheckJob.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
