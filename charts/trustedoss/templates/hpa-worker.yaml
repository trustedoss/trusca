{{- if and .Values.worker.autoscaling.enabled (eq .Values.worker.autoscaling.mode "cpu") -}}
# Worker HPA — behind a feature flag, OFF by default (chart convention).
# When enabled the worker Deployment omits its static replicas so this HPA
# owns the count.
#
# S5 (concurrency-scaling-plan-2026-08-22.md §3.2/§4): only rendered when
# worker.autoscaling.mode is "cpu" (the default). Setting mode: queue renders
# scaledobject-worker.yaml INSTEAD of this file, never alongside it -- KEDA
# creates its own HorizontalPodAutoscaler from a ScaledObject, so having both
# would put two HPAs on the same scaleTargetRef, fighting each other over the
# replica count.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "trustedoss.fullname" . }}-worker
  labels:
    {{- include "trustedoss.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "trustedoss.fullname" . }}-worker
  minReplicas: {{ .Values.worker.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.worker.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.worker.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
