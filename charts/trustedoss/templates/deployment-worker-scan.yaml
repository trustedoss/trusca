{{- /*
S3 (concurrency-scaling-plan-2026-08-22.md §3.2/§4): the scan-pipeline
worker. Split out of the single `worker` Deployment this chart used to
render (see values.yaml's worker.scan block for why). Runs
scan_source/scan_container/ingest_sbom/scan_reachability -- the only tasks
that can occupy a slot for up to the scan hard time limit -- and, per
worker.subscriptions.scan (both queues by default), the default queue as
well, so it can drain a pre-split scan message still sitting there in a
cluster upgrading late. See _helpers.tpl's trustedoss.worker.subscribedQueues.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trustedoss.fullname" . }}-worker-scan
  labels:
    {{- include "trustedoss.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-scan
spec:
  {{- if not .Values.worker.scan.autoscaling.enabled }}
  # When the HPA/KEDA is enabled (worker.scan.autoscaling) we omit replicas so
  # the autoscaler owns the count; otherwise this static value applies.
  replicas: {{ .Values.worker.scan.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "trustedoss.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker-scan
  template:
    metadata:
      labels:
        {{- include "trustedoss.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker-scan
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # S4 (concurrency-scaling-plan-2026-08-22.md §3.2/§4): give a
      # terminating scan-worker pod enough time to finish the scan it is
      # already running instead of being SIGKILLed mid-scan (see
      # worker.scan.terminationGracePeriodSeconds in values.yaml for why this
      # must stay above the scan pipeline's hard time limit).
      terminationGracePeriodSeconds: {{ .Values.worker.scan.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "trustedoss.serviceAccountName" (dict "root" $ "component" "worker-scan") }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.workerRepository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.worker.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Prefork concurrency = task slots per pod. Scale pods
          # (worker.scan.replicaCount / autoscaling) in preference to this;
          # each slot can fork a full pipeline.
          #
          # S3: `-Q` pins this deployment to worker.subscriptions.scan, which
          # keeps the default queue alongside the scan queue so a pre-split
          # message left there still drains (see
          # trustedoss.worker.subscribedQueues in _helpers.tpl). Every task
          # name Celery routes here must appear in
          # tests/contracts/queue-names.json's scan_task_names, which is the
          # oracle apps/backend/tasks/celery_app.py's task_routes also reads.
          command:
            - celery
            - -A
            - tasks.celery_app
            - worker
            - --loglevel=info
            - --concurrency={{ .Values.worker.scan.concurrency }}
            - -Q
            - {{ include "trustedoss.worker.subscribedQueues" (dict "root" $ "own" "scan") }}
          # S4: Celery already treats a bare SIGTERM as a WARM shutdown (stop
          # consuming new tasks, let the currently-executing task run to
          # completion) as long as REMAP_SIGTERM is unset (it is, in this
          # image -- see apps/backend/Dockerfile.worker) --
          # celery/apps/worker.py maps SIGTERM -> 'Warm' by default. This
          # preStop hook does not replace that; it triggers the SAME warm
          # shutdown (celery.worker.control.shutdown() raises WorkerShutdown()
          # in-process) through Celery's own control bus instead of relying
          # solely on OS signal delivery, so the worker starts winding down
          # the instant the pod is marked Terminating rather than only after
          # kubelet finishes its own bookkeeping and gets around to sending
          # SIGTERM. `-d celery@$HOSTNAME` scopes the broadcast to THIS pod
          # only (same node-name pattern the livenessProbe below already
          # uses) so scaling down one replica cannot shut down its siblings.
          # `--timeout=5` bounds the control-bus round trip and `|| true`
          # keeps a broker hiccup from blocking pod termination -- either way
          # the subsequent SIGTERM (sent right after this hook returns) is
          # the actual backstop.
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - celery -A tasks.celery_app control shutdown -d celery@"$HOSTNAME" --timeout=5 || true
          envFrom:
            - configMapRef:
                name: {{ include "trustedoss.fullname" . }}-env
            {{- include "trustedoss.extraEnvFrom" . | nindent 12 }}
          env:
            {{- include "trustedoss.runtimeSecretEnv" . | nindent 12 }}
            {{- include "trustedoss.extraEnv" . | nindent 12 }}
          volumeMounts:
            {{- if (.Values.worker.containerSecurityContext).readOnlyRootFilesystem }}
            # The bundled toolchain caches under HOME: gradle, mvn, npm, dotnet
            # and go all write there when cdxgen shells out to them. The image
            # pins every one of those paths under /home/trustedoss, so mounting
            # that single directory covers all of them. emptyDir means the
            # caches live as long as the pod; swap in a PVC if repeated Java or
            # .NET scans make the re-download cost worth persisting.
            - name: home
              mountPath: /home/trustedoss
            - name: tmp
              mountPath: /tmp
            {{- end }}
            - name: workspace
              mountPath: {{ .Values.workspace.mountPath }}
            # H-6/L-2 — Trivy DB cache (boot download + weekly refresh write
            # here; backend mounts the same volume read-only for telemetry).
            - name: trivy-cache
              mountPath: {{ .Values.env.trivy.dbCacheDir }}
            {{- include "trustedoss.extraVolumeMounts" . | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A tasks.celery_app inspect ping --timeout=5 -d celery@$HOSTNAME > /dev/null 2>&1
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
          resources:
            {{- toYaml .Values.worker.scan.resources | nindent 12 }}
      volumes:
        {{- if (.Values.worker.containerSecurityContext).readOnlyRootFilesystem }}
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- end }}
        - name: workspace
          {{- if .Values.workspace.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.workspace.persistence.existingClaim | default (printf "%s-workspace" (include "trustedoss.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: trivy-cache
          {{- if .Values.trivyCache.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.trivyCache.persistence.existingClaim | default (printf "%s-trivy-cache" (include "trustedoss.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- include "trustedoss.extraVolumes" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
