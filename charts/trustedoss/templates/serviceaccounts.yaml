{{- if .Values.serviceAccount.create -}}
{{- /*
S3 (concurrency-scaling-plan-2026-08-22.md §3.2/§4): "worker" split into
"worker-scan" and "worker-default" -- each Deployment gets its own least-
privilege ServiceAccount, same as every other workload here.

"migrate" and "check-config" additionally get pre-install,pre-upgrade hook
annotations (weight -10, before either Job's own hook: check-config is -6,
migrate is -5 — see job-check-config.yaml / job-migrate.yaml). Without this,
a fresh `helm install` fails every time: pre-install hooks run before ANY
non-hook resource in the chart, so on a brand-new release these two Jobs'
ServiceAccounts would not exist yet when the Jobs' hook fires
("serviceaccount ... not found", Job stuck until activeDeadlineSeconds and
marked Failed — observed on k8s-stg-incheon, 2026-09-16). No
hook-delete-policy is set: these must survive past their own hook step for
the Job pod (a later, higher-weight hook) to use them, and they are not
scoped to a single release invocation the way a Job is, so
"before-hook-creation" is the only policy applied — it replaces the
ServiceAccount cleanly on the next install/upgrade hook run without ever
deleting it out from under a job that still needs it.

The other five (backend/worker-scan/worker-default/beat/frontend) stay
plain resources — they back long-running Deployments, not one-shot hook
Jobs, so normal resource ordering (after all hooks) already puts them
before the Deployments that reference them.
*/ -}}
{{- range $component := list "backend" "worker-scan" "worker-default" "beat" "frontend" "migrate" "check-config" }}
---
# One ServiceAccount per workload (least privilege). None request RBAC against
# the Kubernetes API — the app talks only to external Postgres / Redis.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "trustedoss.serviceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "trustedoss.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- if or (eq $component "migrate") (eq $component "check-config") $.Values.serviceAccount.annotations }}
  annotations:
    {{- if or (eq $component "migrate") (eq $component "check-config") }}
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- end }}
    {{- with $.Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
