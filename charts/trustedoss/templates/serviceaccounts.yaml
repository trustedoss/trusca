{{- if .Values.serviceAccount.create -}}
{{- /*
S3 (concurrency-scaling-plan-2026-08-22.md §3.2/§4): "worker" split into
"worker-scan" and "worker-default" -- each Deployment gets its own least-
privilege ServiceAccount, same as every other workload here.
*/ -}}
{{- range $component := list "backend" "worker-scan" "worker-default" "beat" "frontend" "migrate" }}
---
# One ServiceAccount per workload (least privilege). None request RBAC against
# the Kubernetes API — the app talks only to external Postgres / Redis.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "trustedoss.serviceAccountName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "trustedoss.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
