apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trustedoss.fullname" . }}-beat
  labels:
    {{- include "trustedoss.labels" . | nindent 4 }}
    app.kubernetes.io/component: beat
spec:
  # Beat is a SINGLETON scheduler — exactly one replica, never more, or
  # periodic tasks (Trivy DB refresh, vulnerability re-match every 6 h,
  # workspace orphan cleaner, source-archive retention) fire twice.
  replicas: 1
  strategy:
    # Recreate (not RollingUpdate) so two beat pods never overlap during a roll.
    type: Recreate
  selector:
    matchLabels:
      {{- include "trustedoss.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: beat
  template:
    metadata:
      labels:
        {{- include "trustedoss.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: beat
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "trustedoss.serviceAccountName" (dict "root" $ "component" "beat") }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.beat.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: beat
          image: "{{ .Values.image.workerRepository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.beat.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - celery
            - -A
            - tasks.celery_app
            - beat
            - --loglevel=info
            - --schedule=/tmp/celerybeat-schedule
          envFrom:
            - configMapRef:
                name: {{ include "trustedoss.fullname" . }}-env
            {{- include "trustedoss.extraEnvFrom" . | nindent 12 }}
          env:
            {{- include "trustedoss.runtimeSecretEnv" . | nindent 12 }}
            {{- include "trustedoss.extraEnv" . | nindent 12 }}
          {{- $beatSealed := (.Values.beat.containerSecurityContext).readOnlyRootFilesystem }}
          {{- if or $beatSealed .Values.env.extraVolumes }}
          # beat writes its schedule database to /tmp (see the --schedule flag
          # above), so a sealed root filesystem needs this mount or the process
          # cannot start. The home mount is for the same toolchain caches the
          # worker needs; beat shares the image and inherits the cache paths.
          #
          # Unlike the other workloads beat mounts nothing when the root
          # filesystem is left writable, so the key itself is conditional. An
          # operator who unseals the filesystem and adds an extra volume would
          # otherwise get a list of mounts with no `volumeMounts:` above it.
          volumeMounts:
            {{- if $beatSealed }}
            - name: home
              mountPath: /home/trustedoss
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- include "trustedoss.extraVolumeMounts" . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.beat.resources | nindent 12 }}
      {{- $beatSealed := (.Values.beat.containerSecurityContext).readOnlyRootFilesystem }}
      {{- if or $beatSealed .Values.env.extraVolumes }}
      volumes:
        {{- if $beatSealed }}
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- end }}
        {{- include "trustedoss.extraVolumes" . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
