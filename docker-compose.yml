# TrustedOSS Portal — production stack.
#
# Compose V1 file format (CLAUDE.md core rule #10: `docker-compose`, not
# `docker compose`). Image tags are pinned to minor + patch (rule #9: no
# `:latest`). All env values are read at runtime from `.env` — never baked
# into images (rule #11).
#
# Quick start:
#   ./scripts/install.sh                        # interactive wizard
#   docker-compose -f docker-compose.yml ps     # confirm `healthy` status
#   open https://${DOMAIN}                      # served via Traefik + LE TLS
#
# Vulnerability data (v2.4.0+, ADR-0001): the worker downloads the Trivy DB on
# first boot (~600 MB, 1-3 minutes) — set TRIVY_DB_REPOSITORY in .env to point
# at an air-gapped mirror. Dependency-Track was REMOVED in v2.4.0; there is no
# longer a `docker-compose.dt.yml` overlay.
#
# Service map:
#   traefik   — edge proxy, TLS termination (Let's Encrypt HTTP-01),
#               publishes :80 and :443 only.
#   postgres  — PostgreSQL 17.2-alpine, primary store, named volume.
#   redis     — Redis 7.4-alpine, Celery broker + result backend.
#   backend   — FastAPI image (ghcr.io/trustedoss/trusca-backend:${IMAGE_TAG}), 4
#               uvicorn workers. Reachable only inside the compose network;
#               Traefik routes `/v1`, `/auth`, `/ws`, `/health`. A backend
#               `/metrics` endpoint (Prometheus exporter) is not implemented
#               in this release, so it is intentionally NOT routed.
#   worker    — Celery worker on the heavier image
#               (ghcr.io/trustedoss/trusca-backend-worker:${IMAGE_TAG}) which carries
#               cdxgen / scancode / Trivy / JRE.
#   beat      — Celery Beat scheduler (vulnerability re-match every 6 h, Trivy
#               DB refresh weekly, workspace orphan cleanup, source-archive
#               retention) — same worker image, separate process.
#   frontend  — nginx + Vite static bundle (ghcr.io/trustedoss/trusca-frontend:
#               ${IMAGE_TAG}). Reachable only inside the compose network;
#               Traefik routes `/`.
#
# Images are pulled from GitHub Container Registry (ghcr.io) published by
# .github/workflows/release.yml on each vX.Y.Z tag. The registry namespace is
# overridable via ${IMAGE_REGISTRY} (default ghcr.io/trustedoss) for forks /
# mirrors / air-gapped sites. There is NO `build:` section here on purpose:
# the file is self-contained so an operator can `curl` just this file plus
# `.env.example` and `docker-compose up -d` — no repository clone required.
# (The only repo-relative path below is scripts/postgres-init.sh, mounted into
# postgres for first-boot role provisioning; the no-clone quick-install doc
# tells the operator to fetch that one file too — see installation/docker-compose.md.)

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-prod}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Marathon bundle 8 (L1) — backend / worker / beat see ONLY the
  # DML-only runtime DSN. `core.config.database_url()` reads
  # DATABASE_URL_APP first, falls back to DATABASE_URL for legacy
  # single-role deployments. We deliberately do NOT propagate
  # DATABASE_URL_OWNER into runtime containers — alembic upgrade is
  # invoked with an explicit `-e DATABASE_URL=$DATABASE_URL_OWNER`
  # override from install.sh / upgrade.sh so the DDL run uses the
  # owner role exactly once, then exits. The runtime can never see
  # the owner DSN, so a runtime RCE cannot DROP TRIGGER on audit_logs.
  # docker-compose V1 (1.29.2 — the project standard, CLAUDE.md rule #10) does
  # NOT expand a NESTED default: `${DATABASE_URL_APP:-${DATABASE_URL}}` leaves a
  # stray trailing `}` when DATABASE_URL_APP is set (L1), so the runtime got the
  # app DSN with a broken `.../trustedoss}` database name and could not connect.
  # The single-brace default form `${A:-$B}` expands cleanly under BOTH V1 and
  # V2 when A is set (verified with 1.29.2 + the V2 plugin), so the L1 runtime
  # now receives the exact trustedoss_app DSN install.sh wrote. Semantics are
  # otherwise unchanged: L1 (DATABASE_URL_APP set) -> app DSN in the container
  # (owner creds never leak to the runtime); single-role installs still resolve
  # via DATABASE_URL. See install-uat.yml `install-uat-l1` for the end-to-end
  # gate that exercises this under V1.
  DATABASE_URL_APP: ${DATABASE_URL_APP:-$DATABASE_URL}
  DATABASE_URL: ${DATABASE_URL_APP:-$DATABASE_URL}
  # H1 — plumb the migration toggle INTO the container. The backend entrypoint
  # reads AUTO_MIGRATE from its own environment (docker-entrypoint.sh); a value
  # in .env is only visible to compose interpolation, never to the container,
  # unless it is referenced here. Without this line install.sh's
  # `AUTO_MIGRATE=false` for L1 role-separated stacks (the runtime app role has
  # no DDL grant, so migrations run once as the owner via install.sh) was
  # silently dropped — the runtime defaulted back to true and attempted DDL as
  # trustedoss_app. Default `true` matches .env.example and the single-role path,
  # so nothing changes for existing deployments. backend / worker / beat share
  # this anchor and the same entrypoint, so all three honour the toggle.
  AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  SECRET_KEY: ${SECRET_KEY}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
  # CLAUDE.md core rule #13 — production must enumerate origins explicitly.
  # No wildcard fallback here: install.sh writes the value into .env.
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  # Workspace is mounted from a host directory (WORKSPACE_HOST_PATH) so
  # large source-trees stay outside the container layer.
  WORKSPACE_HOST_PATH: /workspace
  # PR-A2: ORT_RULES_PATH removed — the backend no longer shells to ORT.
  # First-party license detection is done by scancode (bundled in the worker
  # image); third-party dependency licenses come declared from cdxgen. The
  # ort/rules.kts placeholder that was kept alongside this note is gone too —
  # a file nothing reads is not a reference, it is a thing to mistake for one.
  # W6-#43a (ADR-0001): DT_URL / DT_API_KEY removed — vulnerability matching
  # runs entirely from the worker via `trivy sbom` against the locally-cached
  # Trivy DB. Air-gapped sites override the upstream OCI registry with
  # TRIVY_DB_REPOSITORY (ghcr.io/aquasecurity/trivy-db by default).
  TRIVY_DB_REPOSITORY: ${TRIVY_DB_REPOSITORY:-ghcr.io/aquasecurity/trivy-db}
  # CI-only knob - NOT for operator use. "mock" short-circuits
  # cdxgen/scancode/Trivy in the worker to fixture frames instead of running
  # the real toolchain (core.config.scan_backend_mode(), read at runtime per
  # CLAUDE.md rule #11). A real deployment must never set this: it produces
  # placeholder results with zero real vulnerability data. Exists here (with
  # the same default as docker-compose.dev.yml) purely so install-uat.yml's
  # `install-uat-l1` job can trigger and complete a first-scan smoke against
  # the published L1 role-separated stack within its CI time budget instead
  # of running the 5-60 minute real pipeline (which also needs a live Trivy
  # DB the job deliberately skips via TRIVY_DB_BOOTSTRAP_ON_START=false).
  TRUSTEDOSS_SCAN_BACKEND: ${TRUSTEDOSS_SCAN_BACKEND:-real}
  # W6-#44 — Trivy DB lifecycle. The worker downloads the DB on boot
  # (worker_ready signal hook) and the beat refreshes it weekly. The cache
  # path is mounted as a named volume on the worker — see the ``volumes:``
  # section below. Operators on air-gapped clusters set
  # TRIVY_DB_BOOTSTRAP_ON_START=false in .env if they manage the cache out
  # of band; the admin/health panel surfaces the staleness so a
  # missed refresh is visible without a network probe.
  TRIVY_CACHE_DIR: ${TRIVY_CACHE_DIR:-/var/lib/trivy}
  TRIVY_DB_REFRESH_HOURS: ${TRIVY_DB_REFRESH_HOURS:-168}
  TRIVY_DB_BOOTSTRAP_ON_START: ${TRIVY_DB_BOOTSTRAP_ON_START:-true}
  TRIVY_DB_BOOTSTRAP_TIMEOUT_SECONDS: ${TRIVY_DB_BOOTSTRAP_TIMEOUT_SECONDS:-900}
  TRIVY_DB_REFRESH_TIMEOUT_SECONDS: ${TRIVY_DB_REFRESH_TIMEOUT_SECONDS:-900}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
  TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
  # ---------------------------------------------------------------------------
  # Concurrency / stability tuning knobs (work-B / B1 + A1 + A2).
  #
  # Backend reads every one of these via os.getenv() at runtime (CLAUDE.md
  # rule #11) — they are NOT baked into the image, so an operator can tune
  # them in .env and bounce the affected service. Defaults below are kept
  # in lock-step with .env.example; the ${VAR:-default} form means an
  # unset .env value resolves to the documented default rather than empty.
  #
  # W1: number of uvicorn worker PROCESSES this container runs. Read by
  # apps/backend/Dockerfile.prod's CMD at container start (a shell `sh -c`
  # default expansion, not a Dockerfile ARG/ENV substitution done at build
  # time), so it works the same way every other knob on this page does.
  # Default 4 matches the image's own default when this is unset entirely
  # (e.g. `docker run` without compose); see the CMD comment in
  # Dockerfile.prod. This is also what the W2 connection-budget formula
  # below multiplies DB_POOL_SIZE + DB_MAX_OVERFLOW by.
  UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
  # DB connection pool — async (FastAPI) engine. Total connections opened by
  # ONE backend process = DB_POOL_SIZE + DB_MAX_OVERFLOW. That gets
  # multiplied by UVICORN_WORKERS above before it reaches Postgres; see the
  # sizing formula in .env.example before raising these on a busy stack.
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-3}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
  DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
  # DB connection pool — sync (Celery / psycopg2) engine. Applies per worker
  # AND per beat process. With worker.replicas=N this multiplies by N.
  DB_SYNC_POOL_SIZE: ${DB_SYNC_POOL_SIZE:-3}
  DB_SYNC_MAX_OVERFLOW: ${DB_SYNC_MAX_OVERFLOW:-3}
  DB_SYNC_POOL_TIMEOUT: ${DB_SYNC_POOL_TIMEOUT:-30}
  DB_SYNC_POOL_RECYCLE: ${DB_SYNC_POOL_RECYCLE:-1800}
  # W2: connection-budget fleet-shape hints for the boot-time over-budget
  # warning in main.py. UVICORN_WORKERS above is real (the Dockerfile CMD
  # reads it too) and covers the process-per-container multiplier, so W1
  # dropped the CONN_BUDGET_UVICORN_WORKERS hint that used to duplicate it
  # (that was the double-configuration state W2 left behind: an operator
  # changing worker count had to remember to update BOTH a real knob and an
  # informational one that only fed the estimate). CONTAINER/POD replica
  # counts have no such real knob yet (plain `docker-compose up` never
  # scales the backend service; WORKER_REPLICAS below only takes effect
  # under Swarm), so those two stay informational-only.
  CONN_BUDGET_BACKEND_REPLICAS: ${CONN_BUDGET_BACKEND_REPLICAS:-1}
  CONN_BUDGET_WORKER_REPLICAS: ${CONN_BUDGET_WORKER_REPLICAS:-1}
  # Scan-trigger abuse controls. Per-user rate limit (slowapi "<n>/<period>")
  # and per-team concurrent (queued+running) scan cap (0 disables).
  SCAN_TRIGGER_RATE_LIMIT: ${SCAN_TRIGGER_RATE_LIMIT:-20/minute}
  SCAN_CONCURRENCY_CAP_PER_TEAM: ${SCAN_CONCURRENCY_CAP_PER_TEAM:-10}
  # Scan task time limits (Celery soft/hard) + orphan-workspace reclaim grace.
  # Backend clamps hard >= soft + 60s, so a soft >= hard typo is self-healing.
  # Consumed by worker + beat (the orphan cleaner runs on the beat schedule);
  # backend reads them too for surfacing in the admin UI.
  SCAN_SOFT_TIME_LIMIT_SECONDS: ${SCAN_SOFT_TIME_LIMIT_SECONDS:-3600}
  SCAN_HARD_TIME_LIMIT_SECONDS: ${SCAN_HARD_TIME_LIMIT_SECONDS:-3900}
  WORKSPACE_ORPHAN_MAX_AGE_SECONDS: ${WORKSPACE_ORPHAN_MAX_AGE_SECONDS:-900}
  # scancode first-party license detection guards (worker stage). Caps wall
  # clock, eligible file count, persisted detections, and result-JSON bytes so
  # an attacker-controlled source tree cannot DoS / OOM the worker.
  SCANCODE_TIMEOUT_SECONDS: ${SCANCODE_TIMEOUT_SECONDS:-600}
  SCANCODE_MAX_FILES: ${SCANCODE_MAX_FILES:-20000}
  SCANCODE_MAX_DETECTIONS: ${SCANCODE_MAX_DETECTIONS:-5000}
  SCANCODE_MAX_RESULT_BYTES: ${SCANCODE_MAX_RESULT_BYTES:-268435456}
  # scanoss vendored-OSS identification (BomLens parity Phase J, P3-11). The
  # worker image ALWAYS ships the scanoss-py CLI (MIT); execution is gated
  # HERE — SCANOSS_ENABLED defaults false, so an unset .env leaves it off while
  # still letting an operator flip it on without a rebuild. SCANOSS_API_URL
  # defaults to the public OSS KB; point it at a private mirror for air-gapped
  # / privacy-sensitive sites. Worker reads each via os.getenv() at runtime
  # (rule #11).
  SCANOSS_ENABLED: ${SCANOSS_ENABLED:-false}
  SCANOSS_API_URL: ${SCANOSS_API_URL:-https://api.osskb.org}
  SCANOSS_API_KEY: ${SCANOSS_API_KEY:-}
  SCANOSS_TIMEOUT_SECONDS: ${SCANOSS_TIMEOUT_SECONDS:-300}
  # These six were documented in .env.example but never listed here, so
  # setting any of them in .env had no effect on the running container:
  # compose only passes through a var that is named in this anchor. Found
  # while auditing the two opt-in outbound lookups below: an air-gapped site
  # following the docs to set EXTERNAL_PACKAGE_LOOKUP_ENABLED=false would not
  # actually have turned it off. Defaults match core/config.py and
  # .env.example exactly, so an unset .env changes nothing for an existing
  # deployment.
  LICENSE_FETCH_ENABLED: ${LICENSE_FETCH_ENABLED:-true}
  SEARCH_RATE_LIMIT: ${SEARCH_RATE_LIMIT:-20/minute}
  INTAKE_REQUESTS_ENABLED: ${INTAKE_REQUESTS_ENABLED:-false}
  EXTERNAL_PACKAGE_LOOKUP_ENABLED: ${EXTERNAL_PACKAGE_LOOKUP_ENABLED:-true}
  EXTERNAL_PACKAGE_LOOKUP_RATE_LIMIT: ${EXTERNAL_PACKAGE_LOOKUP_RATE_LIMIT:-10/minute}
  EXTERNAL_ADVISORY_LOOKUP_RATE_LIMIT: ${EXTERNAL_ADVISORY_LOOKUP_RATE_LIMIT:-20/minute}
  # Fernet key for secrets-at-rest (GitHub App credentials AND — v2.3-s1 — the
  # cosign key password). Unset in dev/CI derives from SECRET_KEY (WARNING);
  # APP_ENV=prod with no key FAILS CLOSED. See core/crypto.py + .env.example.
  GITHUB_APP_ENCRYPTION_KEY: ${GITHUB_APP_ENCRYPTION_KEY:-}
  # A5 - dedicated, rotatable HMAC key for hashing stored API-key secrets
  # (core.config.api_key_hmac_secret). Same fail-closed posture as
  # GITHUB_APP_ENCRYPTION_KEY above (unset in dev/CI derives from SECRET_KEY
  # with a WARNING; APP_ENV=prod with no key FAILS CLOSED), but unlike that
  # var this one sits on the default authenticated-API path, not an opt-in
  # integration. install.sh auto-generates it the same way it generates
  # SECRET_KEY, so a fresh prod install always ships one. Read via
  # os.getenv() at runtime (rule #11); never baked into the image.
  API_KEY_HMAC_SECRET: ${API_KEY_HMAC_SECRET:-}
  # cosign SBOM signing (v2.3-s1). KEY-BASED is the default (D2); keyless is
  # opt-in via COSIGN_KEYLESS=true. Signing is best-effort — an unset key just
  # means unsigned SBOMs, not a failed scan. Worker reads each via os.getenv()
  # at runtime (rule #11). The cosign key volume is mounted on the worker/beat
  # services below (read-only) from COSIGN_KEYS_HOST_PATH.
  COSIGN_KEYLESS: ${COSIGN_KEYLESS:-false}
  COSIGN_KEY_PATH: ${COSIGN_KEY_PATH:-}
  COSIGN_KEY_PASSWORD_ENCRYPTED: ${COSIGN_KEY_PASSWORD_ENCRYPTED:-}
  COSIGN_TIMEOUT_SECONDS: ${COSIGN_TIMEOUT_SECONDS:-120}

services:
  # ---------------------------------------------------------------------------
  # Edge — Traefik v3.2 with HTTP→HTTPS redirect and Let's Encrypt HTTP-01.
  # ---------------------------------------------------------------------------
  traefik:
    # Docker Engine 29+ raised its MINIMUM negotiable API to 1.44 and rejects the
    # Docker client's legacy 1.24 default. Traefik ≤ v3.5 hard-used 1.24 for the
    # docker provider (it ignores DOCKER_API_VERSION when negotiation is on), so
    # on Docker 29 it logged "client version 1.24 is too old" on a loop, found no
    # routers, and served its self-signed default cert (no Let's Encrypt, no
    # routing). v3.6.1 added real Docker API version negotiation (queries the
    # daemon's supported range and picks the highest mutual version) — the fix
    # for this exact incident. Do not drop below v3.6.1 while hosts run Docker 29+.
    image: traefik:v3.6.1
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=trustedoss"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.email=${TLS_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
      # Dashboard stays OFF in prod — operators expose it temporarily via
      # an SSH tunnel + a one-shot `--api.dashboard=true --api.insecure=true`
      # override when needed.
      - "--api.dashboard=false"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik-acme:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - trustedoss
    healthcheck:
      # Traefik returns 404 on `/` when no router matches — that's a sign
      # the daemon is up. We accept any HTTP status from the entrypoint.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/ > /dev/null 2>&1 || true; exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  # ---------------------------------------------------------------------------
  # Datastore — PostgreSQL 17.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Marathon bundle 8 (L1) — runtime role provisioning. The init
      # script reads POSTGRES_APP_USER / POSTGRES_APP_PASSWORD and
      # creates the trustedoss_app role on FIRST container boot only
      # (postgres-data volume is empty). Existing deployments with a
      # populated volume keep their pre-L1 single-role posture until
      # the operator manually creates the role + re-runs alembic.
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-trustedoss_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # First-boot init script that creates the L1 runtime role.
      # Postgres only runs files in /docker-entrypoint-initdb.d/ when
      # the data dir is empty (i.e. fresh install). Re-applying L1 to
      # an existing deployment requires the operator to run the SQL
      # by hand — see docs-site admin-guide for the runbook.
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/10-trustedoss-app-role.sh:ro
    networks:
      - trustedoss
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # ---------------------------------------------------------------------------
  # Broker — Redis 7.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - trustedoss
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ---------------------------------------------------------------------------
  # API — FastAPI + uvicorn, fronted by Traefik on /api and /health.
  # ---------------------------------------------------------------------------
  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/trustedoss}/trusca-backend:${IMAGE_TAG:-0.12.0}
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      # Workspace is shared with the worker so cdxgen / scancode outputs are
      # readable across both processes.
      - workspace:/workspace
      # H-6 — read-only view of the worker-maintained Trivy DB cache. The
      # admin/health Trivy panel and the admin/disk `trivy_db` card read
      # `$TRIVY_CACHE_DIR/db/metadata.json`; without this mount the backend
      # reported the DB state as "unknown" even while the worker matched
      # vulnerabilities fine.
      - trivy-cache:/var/lib/trivy:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trustedoss
    healthcheck:
      # v2.1 Track B (B1) — READINESS gate, not liveness. The compose
      # `service_healthy` condition on worker / beat (below) must mean "the
      # Postgres schema is at the Alembic HEAD", not merely "uvicorn answers".
      # /health/ready returns 200 only when the schema == HEAD, so:
      #   * AUTO_MIGRATE=true  — backend runs `alembic upgrade head` on start
      #     (docker-entrypoint.sh) and only then does /health/ready flip to 200;
      #     dependents start against a migrated schema.
      #   * AUTO_MIGRATE=false — uvicorn answers /health immediately, but
      #     /health/ready stays 503 (and the container stays `health: starting`)
      #     until an EXTERNAL `alembic upgrade head` (owner role; install.sh /
      #     upgrade.sh) brings the schema to HEAD. This is intentional: worker /
      #     beat wait for the schema, not just for the process. The pure-liveness
      #     /health route still exists for liveness-only consumers / debugging.
      # `start_period` is generous so a long migration on a big DB does not flip
      # the container to `unhealthy` before the first migrate completes.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=trustedoss"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      # Marathon bundle 7 — API path consistency. Backend routers are
      # mounted at /v1/*, /auth/*, /ws/* directly. Traefik now routes
      # those prefixes 1:1 to the backend service (no /api prefix, no
      # strip middleware). Operator-facing docs / CI integrations /
      # webhook URLs all reference /v1/... — this rule makes the
      # documented paths actually work against the prod stack. The
      # `/health` PREFIX (v2.1 B1) routes BOTH /health (liveness) and
      # /health/ready (readiness) to the backend so external probes /
      # load balancers reach the readiness gate, not just the in-container
      # Compose healthcheck. A backend `/metrics` endpoint (Prometheus
      # exporter) is not implemented in this release, so `/metrics` is NOT
      # routed here — routing it would only return 404s. It will be added
      # alongside the exporter (post-GA roadmap).
      - "traefik.http.routers.backend.rule=Host(`${DOMAIN}`) && (PathPrefix(`/v1`) || PathPrefix(`/auth`) || PathPrefix(`/ws`) || PathPrefix(`/health`))"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=le"
      - "traefik.http.routers.backend.middlewares=security-headers@docker"
      # security-headers middleware — DEFINED here via docker-provider labels
      # (backend carries traefik.enable=true, so the provider parses them) and
      # referenced as `@docker` by BOTH the backend and frontend routers. It was
      # previously referenced as `security-headers@file`, but no file provider was
      # ever enabled and no dynamic config ever defined it — so the moment the
      # docker provider actually worked (Traefik ≥ v3.6.1 on Docker 29) both
      # routers became INVALID ("middleware security-headers@file does not
      # exist"). Defining it inline keeps everything in the docker provider — no
      # extra file mount or --providers.file flag needed.
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=63072000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  # ---------------------------------------------------------------------------
  # Celery workers - split into two dedicated services (S3,
  # concurrency-scaling-plan-2026-08-22.md §3.2/§4/§5). `worker-scan` runs
  # cdxgen / scancode / Trivy for the scan pipeline
  # (scan_source/scan_container/ingest_sbom/scan_reachability). `worker-default`
  # runs everything else (notifications, backups, audit export, ticket
  # webhooks, catalog-refresh beats, retention sweeps, the scan-schedule
  # poll) - short, frequent tasks that must never queue behind an hour-long
  # scan. Before this split both ran as one `worker` service on one queue.
  #
  # QUEUES (WORKER_SCAN_QUEUES / WORKER_DEFAULT_QUEUES, `-Q` below): for one
  # release after this split ships, BOTH services default to subscribing to
  # BOTH queues ("trustedoss.scan,trustedoss.default") - a rolling
  # `docker-compose up` recreates containers one service at a time, so
  # whichever new service comes up first must still be able to drain
  # anything left on "trustedoss.default" (the unchanged pre-split queue
  # name) from before the split, including scan-pipeline messages dispatched
  # before the upgrade. Narrow to one queue each ONLY after confirming that
  # backlog has drained - see the "Queue split transition" note in
  # .env.example's worker section for the exact procedure. Cross-checked
  # against tests/contracts/queue-names.json, the vocabulary
  # apps/backend/tasks/celery_app.py's task_routes also reads.
  #
  # Scaling out (work-B / B2, still true post-split): two knobs per service,
  # used together:
  #
  #   * CELERY_CONCURRENCY / CELERY_DEFAULT_CONCURRENCY - parallel task slots
  #                           INSIDE one worker process (prefork). A scan
  #                           slot can fork a full cdxgen / scancode / Trivy /
  #                           dotnet pipeline (~1.5-2 GB transient) - keep
  #                           CELERY_CONCURRENCY modest (2-4) and prefer
  #                           adding replicas. Default-queue tasks are much
  #                           lighter, so CELERY_DEFAULT_CONCURRENCY defaults
  #                           higher.
  #   * replicas            - number of worker CONTAINERS per service. Run
  #                           more containers to spread load across cores /
  #                           hosts.
  #
  # Bring up N containers of a given kind two ways (docker-compose V1 -
  # CLAUDE.md #10):
  #
  #   a) Ad-hoc:   docker-compose -f docker-compose.yml up -d --scale worker-scan=4
  #   b) Pinned:   set `deploy.replicas` below (Swarm mode) OR keep --scale in
  #                your install/upgrade scripts. We default to a single
  #                replica per service; uncomment `deploy.replicas` only
  #                under Swarm.
  #
  # SIZING: total Postgres connections from the worker fleet =
  #   (WORKER_REPLICAS + WORKER_DEFAULT_REPLICAS) x (DB_SYNC_POOL_SIZE + DB_SYNC_MAX_OVERFLOW).
  # Add the backend + beat draw and stay under Postgres `max_connections`
  # (100); see the formula block in .env.example (core.connection_budget is
  # the oracle both derive from). WORKER_REPLICAS keeps its pre-split name
  # (worker-scan is the direct continuation of the pre-split single worker's
  # identity - same env var, same default) so an existing .env file's value
  # keeps applying to the heavy/tuned side of the split without an operator
  # edit; WORKER_DEFAULT_REPLICAS is new.
  #
  # MEMORY: a scan-worker container needs roughly
  #   CELERY_CONCURRENCY x ~2 GB  +  ~1 GB base (JRE / Node / scancode).
  # The 6G limit below comfortably covers concurrency=2. Raise it in step
  # with CELERY_CONCURRENCY; the SCANCODE_* guards cap per-task blowups. The
  # default-queue worker never forks that pipeline, so it gets a much
  # smaller limit (see worker-default below).
  # ---------------------------------------------------------------------------
  worker-scan:
    image: ${IMAGE_REGISTRY:-ghcr.io/trustedoss}/trusca-backend-worker:${IMAGE_TAG:-0.12.0}
    restart: unless-stopped
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2} -Q ${WORKER_SCAN_QUEUES:-trustedoss.scan,trustedoss.default}
    # S4 (concurrency-scaling-plan-2026-08-22.md §3.2/§4): how long
    # `docker-compose stop` / `down` waits after sending SIGTERM before it
    # SIGKILLs this container. Compose's own default is 10s, far shorter
    # than a scan can legitimately run. tasks/celery_app.py sets
    # task_acks_late=True + task_reject_on_worker_lost=True, so a SIGKILLed
    # worker's in-flight scan is not lost outright: it is redelivered and
    # RESTARTS FROM ZERO on another worker (or the same one, on the next
    # `up`), which is exactly the discarded-progress paradox S4 exists to
    # avoid. SIGTERM alone already triggers Celery's warm shutdown (stop
    # consuming new tasks, let the running task finish), verified in
    # celery/apps/worker.py, and this image never sets REMAP_SIGTERM, so no
    # separate stop_signal override is needed here, only enough grace.
    #
    # Mirrors the Helm chart's worker.scan.terminationGracePeriodSeconds
    # default (charts/trustedoss/values.yaml): the scan pipeline's hard time
    # limit (SCAN_HARD_TIME_LIMIT_SECONDS, core/config.py::scan_hard_time_limit_seconds(),
    # default 3900s / 65 min) plus the same 300s safety margin used there
    # (BROKER_VISIBILITY_TIMEOUT_MARGIN_SECONDS). Static, not derived (Compose
    # cannot read the Python accessor either), so raising
    # SCAN_HARD_TIME_LIMIT_SECONDS must be paired with raising this too.
    stop_grace_period: 4200s
    environment:
      <<: *backend-env
    volumes:
      - workspace:/workspace
      # v2.3-s1 — cosign signing keys (read-only). COSIGN_KEYS_HOST_PATH points
      # at the host dir holding cosign.key/cosign.pub (default ./secrets/cosign,
      # created by scripts/cosign-keygen.sh). Mounted at /cosign so
      # COSIGN_KEY_PATH=/cosign/cosign.key. Harmless when keyless / unconfigured
      # - an empty/absent dir just yields unsigned SBOMs (best-effort). Scan-only:
      # cosign signing happens in tasks/scan_source.py, which only ever runs on
      # this service post-S3 - worker-default does not mount this.
      - ${COSIGN_KEYS_HOST_PATH:-./secrets/cosign}:/cosign:ro
      # W6-#44 — persistent Trivy DB cache. The worker downloads the DB
      # (~500 MiB) on boot via the worker_ready signal hook and refreshes it
      # weekly via the Celery beat. Without a persistent volume every
      # container restart would re-download the DB (3+ min cold-start hit).
      # The cache is shared with the beat container and worker-default below
      # so the beat's weekly refresh writes through the same mount every
      # reader uses. Set TRIVY_CACHE_DIR=/var/lib/trivy in .env to point
      # trivy at this mount.
      - trivy-cache:/var/lib/trivy
      # Every toolchain cache in one mount. See the volume declaration at the
      # bottom of this file for why the image pins them all under HOME and
      # what goes wrong when nothing is mounted here.
      - worker-scan-cache:/home/trustedoss
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # v2.1 — SCHEMA-READINESS gate (B1). The worker image (Dockerfile.worker)
      # deliberately does NOT run migrations — backend is the sole migrator — so
      # the worker waits for backend to be healthy before starting Celery. As of
      # B1, backend's healthcheck probes /health/ready (schema == Alembic HEAD),
      # so `service_healthy` now GUARANTEES the schema is migrated before any
      # Celery task touches the DB — under BOTH toggles:
      #   * AUTO_MIGRATE=true  — backend runs `alembic upgrade head` on start and
      #     /health/ready flips to 200 once it finishes; the worker then starts.
      #   * AUTO_MIGRATE=false — backend answers /health immediately but stays
      #     `health: starting` (/health/ready = 503) until an EXTERNAL
      #     `alembic upgrade head` (owner role; install.sh / upgrade.sh) brings
      #     the schema to HEAD. The worker correctly WAITS for that, instead of
      #     starting against a not-yet-migrated schema. (Pre-B1 this case degraded
      #     to a plain ordering dependency — see docs-site deployment notes.)
      backend:
        condition: service_healthy
    networks:
      - trustedoss
    healthcheck:
      test:
        - "CMD-SHELL"
        - "celery -A tasks.celery_app inspect ping --timeout=5 -d celery@$$HOSTNAME > /dev/null 2>&1 || exit 1"
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    deploy:
      # `replicas` is honoured only under `docker stack deploy` (Swarm). Under
      # plain `docker-compose up` it is ignored - use `--scale worker-scan=N`
      # instead (see the header note). Left at 1 so a non-Swarm `up` is
      # predictable; bump for a Swarm deployment.
      replicas: ${WORKER_REPLICAS:-1}
      resources:
        limits:
          # Workers do real work (Java + Node + scancode + Trivy) — give them
          # headroom. Scale this WITH CELERY_CONCURRENCY (~2G per slot + 1G base).
          # Env-overridable because Compose V2 REJECTS a cpus limit greater than
          # the host's online CPU count at `up` ("range of CPUs is from 0.01 to
          # N") — the stock 4.0 breaks `up -d` on a 2-vCPU box (the CAX11/CX23
          # demo default). install.sh clamps WORKER_CPU_LIMIT to the host CPU
          # count; big hosts keep the full 4.0 via the default.
          cpus: "${WORKER_CPU_LIMIT:-4.0}"
          memory: 6G
        reservations:
          # Guarantee a worker the floor it needs to even start the toolchain,
          # so the scheduler does not over-pack a host and OOM-kill mid-scan.
          cpus: "1.0"
          memory: 2G

  # ---------------------------------------------------------------------------
  # Celery default-queue worker (S3) - notifications, backups, audit export,
  # ticket webhooks, catalog-refresh beats, workspace/tarball retention
  # sweeps, the scan-schedule poll. Never forks a cdxgen/scancode/Trivy
  # pipeline, so it gets a much lighter resource profile than worker-scan
  # above, and a higher default concurrency is safe for the same reason.
  # Mirrors charts/trustedoss/values.yaml's worker.default block - see that
  # file's comments for the full sizing rationale (S3 judgment call).
  # ---------------------------------------------------------------------------
  worker-default:
    image: ${IMAGE_REGISTRY:-ghcr.io/trustedoss}/trusca-backend-worker:${IMAGE_TAG:-0.12.0}
    restart: unless-stopped
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=${CELERY_DEFAULT_CONCURRENCY:-4} -Q ${WORKER_DEFAULT_QUEUES:-trustedoss.scan,trustedoss.default}
    # S3 judgment call: shorter than worker-scan's 4200s - this service never
    # runs a scan task. Sized off BACKUP_SUBPROCESS_TIMEOUT's default (3600s,
    # apps/backend/tasks/backup.py - the longest task this worker runs) plus
    # the same 300s margin S4 uses elsewhere, not the scan pipeline's hard
    # limit. Mirrors charts/trustedoss/values.yaml's
    # worker.default.terminationGracePeriodSeconds; raising
    # BACKUP_SUBPROCESS_TIMEOUT must be paired with raising this too.
    stop_grace_period: 3900s
    environment:
      <<: *backend-env
    volumes:
      - workspace:/workspace
      # trustedoss.vulnerability_rematch_one/_enqueue and
      # trustedoss.trivy_db_refresh both run on this service (S3: neither is
      # a scan-pipeline task) and both read/write the Trivy DB cache, so this
      # mount is required here too, not just on worker-scan.
      - trivy-cache:/var/lib/trivy
      # This service resolves dependency graphs too (the rematch task reads
      # preserved SBOMs through the same toolchain), so it fills the same
      # caches and needs the same mount. Measured: 2.0 GB of Maven and npm in
      # its writable layer over 48 hours, against worker-scan's 2.3 GB.
      - worker-default-cache:/home/trustedoss
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Same schema-readiness gate as worker-scan - see that service's
      # comment for the full AUTO_MIGRATE explanation.
      backend:
        condition: service_healthy
    networks:
      - trustedoss
    healthcheck:
      test:
        - "CMD-SHELL"
        - "celery -A tasks.celery_app inspect ping --timeout=5 -d celery@$$HOSTNAME > /dev/null 2>&1 || exit 1"
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    deploy:
      # `replicas` is honoured only under `docker stack deploy` (Swarm). Under
      # plain `docker-compose up` it is ignored - use `--scale worker-default=N`
      # instead.
      replicas: ${WORKER_DEFAULT_REPLICAS:-1}
      resources:
        limits:
          # No pipeline to fork here - a fraction of worker-scan's budget.
          # Env-overridable for the same Compose-V2-CPU-limit-vs-host-count
          # reason WORKER_CPU_LIMIT is (see worker-scan above); this worker's
          # own default (1.0) is small enough that install.sh/upgrade.sh do
          # not need to clamp it the way they clamp WORKER_CPU_LIMIT.
          cpus: "${WORKER_DEFAULT_CPU_LIMIT:-1.0}"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # ---------------------------------------------------------------------------
  # Celery Beat — periodic scheduler (Trivy DB refresh, vulnerability re-match,
  # workspace orphan cleaner, source-archive retention).
  # ---------------------------------------------------------------------------
  beat:
    image: ${IMAGE_REGISTRY:-ghcr.io/trustedoss}/trusca-backend-worker:${IMAGE_TAG:-0.12.0}
    restart: unless-stopped
    command: celery -A tasks.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      <<: *backend-env
    # RUN EXACTLY ONE. Celery beat holds no lock: every beat process fires the
    # whole schedule on its own clock, so a second one double-enqueues every
    # periodic task. `docker-compose up --scale beat=2`, or two hosts each
    # running this file, silently doubles the catalog refreshes, the retention
    # sweeps and the scan-schedule poll. There is no error to notice, only
    # duplicate work. Scale the workers instead, which is what a backlog
    # actually needs (ER11). An HA deployment that genuinely needs a standby
    # scheduler needs a locking scheduler such as RedBeat; this file does not
    # ship one.
    #
    # NOTE: beat does NOT mount the trivy-cache volume. Beat is a
    # pure scheduler — it only enqueues ``trustedoss.trivy_db_refresh`` into
    # the broker. The actual ``trivy --download-db-only`` subprocess runs
    # in the worker container, which is where the volume is mounted. Adding
    # a beat-side mount would create a write-shared-volume contention
    # surface without functional benefit.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # v2.1 - SCHEMA-READINESS gate (B1, same rationale as the workers). beat
      # already waits on worker-default-healthy (which in turn waits on
      # backend), so beat starts after backend. Since backend's healthcheck
      # now probes /health/ready (schema == Alembic HEAD), `service_healthy`
      # GUARANTEES the schema is migrated before beat schedules its first
      # DB-touching task - under BOTH toggles (AUTO_MIGRATE=true migrates on
      # start; =false waits for the external owner-role `alembic upgrade
      # head` before backend goes healthy). We list backend explicitly so
      # the gate is self-documenting and holds even if the worker dependency
      # is relaxed.
      #
      # S3: waits on worker-default specifically, not worker-scan - every
      # task beat's own schedule enqueues directly (source_archive_cleaner,
      # scan_source_cleaner, workspace_cleaner, backup.run, audit export,
      # the catalog-refresh beats, trivy_db_refresh, scan_schedule_poll) is a
      # default-queue task; none of beat's schedule entries are themselves
      # scan_source/scan_container/ingest_sbom/scan_reachability (the poll
      # only dispatches those indirectly, at task-run time, not at beat
      # startup).
      backend:
        condition: service_healthy
      worker-default:
        condition: service_healthy
    networks:
      - trustedoss
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ---------------------------------------------------------------------------
  # SPA — Vite bundle served by nginx, fronted by Traefik on `/`.
  # ---------------------------------------------------------------------------
  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/trustedoss}/trusca-frontend:${IMAGE_TAG:-0.12.0}
    restart: unless-stopped
    networks:
      - trustedoss
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=trustedoss"
      - "traefik.http.services.frontend.loadbalancer.server.port=8080"
      # Catch-all for the configured DOMAIN — backend router has higher
      # specificity (PathPrefix), so /api stays on the backend.
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=le"
      - "traefik.http.routers.frontend.middlewares=security-headers@docker"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  trustedoss:
    name: trustedoss
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  traefik-acme:
  workspace:
  # W6-#44 — persistent Trivy vulnerability DB cache. Mounted on the worker
  # at /var/lib/trivy. The cache holds the ~500 MiB DB downloaded on first
  # boot (worker_ready signal hook) and refreshed weekly (beat task). A
  # named volume survives container restarts so a worker recycle does not
  # trigger another 1-3 minute download. Operators on air-gapped clusters
  # can bind-mount a host directory instead — see
  # docs-site/docs/admin-guide/vulnerability-data.md §"Air-gapped operation".
  trivy-cache:
  # The toolchain caches (Maven, npm, Go, NuGet, Gradle, the license index).
  # ``Dockerfile.worker`` pins every tool's cache under the worker's HOME
  # precisely so one mount covers all of them, and the Helm chart already
  # mounts an emptyDir there. Compose did not, so on every compose deployment
  # the caches went to the container's writable layer instead: invisible to
  # ``docker system df``, impossible to clear without recreating the
  # container (which kills whatever scan is running), and growing with every
  # distinct dependency the corpus has ever pulled. 4.3 GB in 48 hours on a
  # 26 GB root partition, measured.
  #
  # One volume per worker rather than one shared between them, matching the
  # chart's per-pod emptyDir: Maven writes into its local repository without
  # locking, so two containers sharing one would be a new race for the sake
  # of a cache-hit rate neither of them was getting before.
  #
  # Size is held by ``trustedoss.toolchain_cache_cleaner`` (beat, 6-hourly,
  # TOOLCHAIN_CACHE_MAX_BYTES). A deployment that would rather give the
  # caches their own disk can redirect these two to a bind mount.
  worker-scan-cache:
  worker-default-cache:
