# A kind cluster with no CNI of its own: engine-kind.yml installs Calico, so
# the NetworkPolicies the chart renders are enforced.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
